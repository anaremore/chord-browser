# chordbrowser.com, served as files. Clank terminates TLS in front of this and
# health-checks /health. www.chordbrowser.com redirects to the bare name.
#
# nginx drops the server's add_header lines in any location with its own, so
# every location that adds a header includes the security headers too
# (headers.inc).

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml text/plain application/json application/xml;

    include /etc/nginx/headers.inc;

    if ($host = www.chordbrowser.com) {
        return 301 https://chordbrowser.com$request_uri;
    }

    # /download/<file>: that file in the newest release (downloads.conf, from site/tools/latest.mjs).
    include /etc/nginx/downloads.conf;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fonts and images never change in place (a new one gets a new name), so they keep.
    location ~* ^/(fonts|images)/ {
        include /etc/nginx/headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Pages share their header and footer (public/partials) through server-side includes; /install is install.html.
    location / {
        include /etc/nginx/headers.inc;
        add_header Cache-Control "public, max-age=300" always;
        ssi on;
        try_files $uri $uri.html $uri/ =404;
    }

    # Only for pages to include, never asked for directly.
    location /partials/ {
        internal;
    }

    error_page 404 /404.html;
}
