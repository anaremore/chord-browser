<!doctype html>
<!-- Step 2 of two-step-pages-email.html: a new document with a password field alone, posted to /session. -->
<html lang="en"><head><meta charset="utf-8"><title>Enter your password</title>
<style>body { margin: 40px; font: 16px system-ui, sans-serif; } label, input, button { display: block; margin: 8px 0; }</style>
</head><body>
<h1>Enter your password</h1>
<form action="/session" method="post">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password">
  <button id="sign-in">Sign in</button>
</form>
</body></html>
