<!doctype html>
<!-- A broker's sign-in, reduced to its structure: MUI fields whose ids React 19.2's useId made (`_r_2_`, read once as the word 2, a confirmation's), a "Forgot" button between them, and a show-password eye. -->
<html><head><meta charset="utf-8"><title>Example - User Dashboard</title><meta name="chord-kind" content="sign-in"></head><body>
<h3>Log in to your account</h3>
<form>
  <div><p>Email</p><div><input aria-invalid="false" id="_r_0_" placeholder="Enter your Email" type="text" name="username" data-chord-expect="username"><fieldset aria-hidden="true"><legend><span aria-hidden="true">&#8203;</span></legend></fieldset></div></div>
  <div><div><p>Password</p><button tabindex="0" type="button">Forgot your password?</button></div>
    <div><input aria-invalid="false" id="_r_2_" placeholder="Enter your Password" type="password" name="password" data-chord-expect="current-password"><div><button tabindex="0" type="button"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 8C3.6 5.3 5.6 4 8 4"></path></svg></button></div><fieldset aria-hidden="true"><legend><span aria-hidden="true">&#8203;</span></legend></fieldset></div></div>
  <div><button tabindex="0" type="submit">Log In</button></div>
</form>
<button type="button">Continue with Google</button>
</body></html>
