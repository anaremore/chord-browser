<!doctype html>
<!-- Gift cards, each with a number and a PIN typed as a password: no credential. -->
<html><head><meta charset="utf-8"><title>Example</title></head><body>
<h2>Pay with gift cards</h2>
<form>
  <input name="card0" placeholder="Gift card number" data-chord-expect="none"><input type="password" name="pin0" placeholder="PIN" data-chord-expect="none">
  <input name="card1" placeholder="Gift card number" data-chord-expect="none"><input type="password" name="pin1" placeholder="PIN" data-chord-expect="none">
  <button>Apply</button>
</form>
</body></html>
