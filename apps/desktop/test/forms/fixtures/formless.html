<!doctype html>
<!-- No form element: fields and a button in a div, as single-page apps have them. -->
<html><head><meta charset="utf-8"><title>Example</title><meta name="chord-kind" content="sign-in"></head><body>
<div class="card">
  <h2>Welcome back</h2>
  <div><input type="email" aria-label="Email address" data-chord-expect="username"></div>
  <div><input type="password" aria-label="Password" data-chord-expect="current-password"></div>
  <div><button type="button">Sign in</button></div>
</div>
</body></html>
