<!doctype html>
<!-- Reset: a new password twice, no username. -->
<html><head><meta charset="utf-8"><title>Example</title><meta name="chord-kind" content="reset"></head><body>
<h2>Reset your password</h2>
<form>
  <input type="password" name="pw1" placeholder="New password" data-chord-expect="new-password">
  <input type="password" name="pw2" placeholder="Repeat it" data-chord-expect="confirmation-password">
  <button>Set password</button>
</form>
</body></html>
