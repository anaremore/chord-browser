<!doctype html>
<!-- The first step of a two-step sign-in that carries the next step's password field, hidden: still a username-only first step. -->
<html><head><meta charset="utf-8"><title>Sign in</title><meta name="chord-kind" content="username-only"></head><body>
<h1>Sign in</h1>
<div>
  <input type="email" id="email" name="email" autocomplete="username" aria-label="Email" data-chord-expect="username">
  <input type="password" name="password" aria-hidden="true" tabindex="-1" style="display:none" data-chord-expect="none">
  <input type="text" name="challenge" autocomplete="off" aria-label="Enter the characters" style="display:none" data-chord-expect="none">
  <button type="button">Need help?</button>
  <button type="button">Next</button>
</div>
</body></html>
