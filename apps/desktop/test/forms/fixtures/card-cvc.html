<!doctype html>
<!-- A card form with its CVC as type=password: no credential at all. -->
<html><head><meta charset="utf-8"><title>Example</title></head><body>
<h2>Payment</h2>
<form>
  <input name="cardnumber" autocomplete="cc-number" placeholder="Card number" data-chord-expect="none">
  <input name="exp" autocomplete="cc-exp" placeholder="MM/YY" data-chord-expect="none">
  <input type="password" name="cvc" placeholder="CVC" data-chord-expect="none">
  <button>Pay</button>
</form>
</body></html>
