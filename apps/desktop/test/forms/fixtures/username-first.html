<!doctype html>
<!-- The first step of a two-step sign-in: an email and Next. -->
<html><head><meta charset="utf-8"><title>Example</title><meta name="chord-kind" content="username-only"></head><body>
<h1>Sign in</h1>
<form>
  <input type="email" name="identifier" autocomplete="username" aria-label="Email or phone" data-chord-expect="username">
  <button>Next</button>
</form>
</body></html>
