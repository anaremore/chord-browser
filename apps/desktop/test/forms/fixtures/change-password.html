<!doctype html>
<!-- Change password: current, new, confirm. -->
<html><head><meta charset="utf-8"><title>Example</title><meta name="chord-kind" content="change"></head><body>
<h2>Change your password</h2>
<form>
  <input type="password" name="old" placeholder="Current password" data-chord-expect="current-password">
  <input type="password" name="new" placeholder="New password" data-chord-expect="new-password">
  <input type="password" name="confirm" placeholder="Confirm new password" data-chord-expect="confirmation-password">
  <button>Save</button>
</form>
</body></html>
