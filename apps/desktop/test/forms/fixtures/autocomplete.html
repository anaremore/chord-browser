<!doctype html>
<!-- autocomplete attributes say it all; the fields are in an odd order. -->
<html><head><meta charset="utf-8"><title>Example</title><meta name="chord-kind" content="sign-in"></head><body>
<form>
  <input type="password" autocomplete="current-password" name="a" data-chord-expect="current-password">
  <input type="text" autocomplete="username" name="b" data-chord-expect="username">
  <button type="submit">Log in</button>
</form>
</body></html>
