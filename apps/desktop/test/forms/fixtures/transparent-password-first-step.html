<!doctype html>
<!-- A first step whose next step's password field is already in the same form, focusable but out of sight (its pane transparent until Next): a username-only first step, so no password is sent to it. -->
<html><head><meta charset="utf-8"><title>Sign in to your account</title><meta name="chord-kind" content="username-only"></head><body>
<form id="signin" action="/session" method="post">
  <div class="pane"><h2>Sign in</h2>
    <input type="email" id="login" name="login" autocomplete="username webauthn" placeholder="Email or phone" data-chord-expect="username">
    <a href="/help">Can't get in?</a>
    <input type="submit" value="Next"></div>
  <div class="pane" style="opacity:0">
    <input type="password" id="passwd" name="passwd" placeholder="Password" data-chord-expect="none"></div>
</form>
</body></html>
