<!doctype html>
<!-- A password and a separate PIN: the password is the password. -->
<html><head><meta charset="utf-8"><title>Example</title><meta name="chord-kind" content="sign-in"></head><body>
<h1>Sign in</h1>
<form>
  <input name="user" placeholder="User ID" data-chord-expect="username">
  <input type="password" name="password" placeholder="Password" data-chord-expect="current-password">
  <input type="password" name="pin" placeholder="Security PIN" data-chord-expect="none">
  <button>Sign in</button>
</form>
</body></html>
