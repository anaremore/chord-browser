<!doctype html>
<!--
  Phase 3B's limit: a sign-in whose fields are in closed shadow roots is out of any page script's
  reach, the agent's too (S17 §4). Chord sees nothing there, and must not take the newsletter's email
  beside it for a username.
-->
<html><head><meta charset="utf-8"><title>Example</title></head><body>
<h1>Sign in</h1>
<x-closed-login><template shadowrootmode="closed">
  <form><input name="username"><input name="password" type="password"><button>Sign in</button></form>
</template></x-closed-login>
<form class="newsletter"><h2>Our newsletter</h2><input type="email" name="email" aria-label="Email" data-chord-expect="none"><button>Subscribe</button></form>
</body></html>
