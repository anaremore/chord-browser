<!doctype html>
<!-- A show-password toggle beside the field. -->
<html><head><meta charset="utf-8"><title>Example</title><meta name="chord-kind" content="sign-in"></head><body>
<form>
  <input type="email" name="email" placeholder="Email address" data-chord-expect="username">
  <input type="password" name="password" placeholder="Password" data-chord-expect="current-password"><button type="button" aria-label="Show password">Show</button>
  <button type="submit">Log in</button>
</form>
</body></html>
