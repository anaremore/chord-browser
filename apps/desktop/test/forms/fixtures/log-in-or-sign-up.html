<!doctype html>
<!-- One page for both: "Log in or sign up" over a single email field, its Continue button outside the <form>. The email decides which step comes next: a username-only first step. -->
<html><head><meta charset="utf-8"><title>Welcome</title><meta name="chord-kind" content="username-only"></head><body>
<main><h1>Log in or sign up</h1>
<button type="button">Continue with a social account</button>
<form id="entry"><label for="email">Email address</label><input id="email" name="email" type="text" data-chord-expect="username"></form>
<p>By continuing you accept the terms.</p>
<button type="button" disabled>Continue</button></main>
</body></html>
