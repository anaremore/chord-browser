<!doctype html>
<!-- An email and a username both before the password: the nearest, the username, is it. -->
<html><head><meta charset="utf-8"><title>Example</title><meta name="chord-kind" content="sign-in"></head><body>
<form>
  <label>Email <input type="email" name="email" data-chord-expect="none"></label>
  <label>Username <input name="username" data-chord-expect="username"></label>
  <label>Password <input type="password" name="password" data-chord-expect="current-password"></label>
  <button>Sign in</button>
</form>
</body></html>
