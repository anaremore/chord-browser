<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Chord's app icon (DESIGN.md §2): three notes of a chord, stacked like
    tabs in a sidebar, each in one Dusk hue (Lilac, Rose, Coral).

    The master for every macOS size, and from 48 px up on Windows and Linux.
    Drawn on Apple's macOS grid: a continuous-corner body 824 px square,
    centered, over a soft shadow. scripts/build-icons.mjs crops it to the
    body for Windows and Linux and drops the shadow (the #plate-shadow
    filter). Their 16, 24 and 32 px icons are redrawn on whole pixels in
    icon-16.svg, icon-24.svg and icon-32.svg.
    After editing any master, run the desktop app's "icons" script.
  -->
  <defs>
    <linearGradient id="plate" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="924">
      <stop offset="0" stop-color="#faf7ff"/>
      <stop offset="1" stop-color="#ffede4"/>
    </linearGradient>
    <linearGradient id="lilac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c3a2ff"/>
      <stop offset="1" stop-color="#9476ec"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff92c0"/>
      <stop offset="1" stop-color="#e85aa6"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffae78"/>
      <stop offset="1" stop-color="#ff6f4c"/>
    </linearGradient>
    <!-- Light from above: a little brighter on top, a touch deeper below. -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.05"/>
    </linearGradient>
    <path id="body" d="M383.41 100 L640.59 100 C722.19 100 763 100 799.79 112.14 L806.92 113.89 C854.88 131.34 892.66 169.12 910.11 217.08 C924 261 924 301.81 924 383.41 L924 640.59 C924 722.19 924 763 911.86 799.79 L910.11 806.92 C892.66 854.88 854.88 892.66 806.92 910.11 C763 924 722.19 924 640.59 924 L383.41 924 C301.81 924 261 924 224.21 911.86 L217.08 910.11 C169.12 892.66 131.34 854.88 113.89 806.92 C100 763 100 722.19 100 640.59 L100 383.41 C100 301.81 100 261 112.14 224.21 L113.89 217.08 C131.34 169.12 169.12 131.34 217.08 113.89 C261 100 301.81 100 383.41 100 Z"/>
    <clipPath id="inside">
      <use href="#body"/>
    </clipPath>
    <filter id="plate-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="lilac-shadow" x="-20%" y="-50%" width="140%" height="220%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#6a4bc4" flood-opacity="0.32"/>
    </filter>
    <filter id="rose-shadow" x="-20%" y="-50%" width="140%" height="220%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#b8357f" flood-opacity="0.32"/>
    </filter>
    <filter id="coral-shadow" x="-20%" y="-50%" width="140%" height="220%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#d4502f" flood-opacity="0.32"/>
    </filter>
  </defs>

  <use href="#body" fill="url(#plate)" filter="url(#plate-shadow)"/>
  <!-- A faint inner edge, so the light body holds its shape on light backgrounds. -->
  <use href="#body" fill="none" stroke="#814a8d" stroke-opacity="0.12" stroke-width="6" clip-path="url(#inside)"/>

  <!-- Back to front. Each note sits in a cutout of the body's own color, so overlaps stay crisp. -->
  <rect x="408" y="346" width="384" height="124" rx="62" fill="url(#lilac)" filter="url(#lilac-shadow)"/>
  <rect x="408" y="346" width="384" height="124" rx="62" fill="url(#sheen)"/>

  <rect x="310" y="440" width="444" height="144" rx="72" fill="url(#plate)"/>
  <rect x="320" y="450" width="424" height="124" rx="62" fill="url(#rose)" filter="url(#rose-shadow)"/>
  <rect x="320" y="450" width="424" height="124" rx="62" fill="url(#sheen)"/>

  <rect x="222" y="544" width="400" height="144" rx="72" fill="url(#plate)"/>
  <rect x="232" y="554" width="380" height="124" rx="62" fill="url(#coral)" filter="url(#coral-shadow)"/>
  <rect x="232" y="554" width="380" height="124" rx="62" fill="url(#sheen)"/>
</svg>
