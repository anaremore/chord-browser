<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chord (stand-in)</title>
<style>
  /* A stand-in for Chord's frame: a tinted sidebar, and a content area the player covers. */
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { display: flex; background: linear-gradient(160deg, #efe7ff, #e3f0ff); font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; color: #2b2540; }
  aside { width: 232px; padding: 44px 10px 10px; box-sizing: border-box; }
  .drag { position: fixed; left: 0; top: 0; width: 232px; height: 40px; -webkit-app-region: drag; }
  .tab { padding: 7px 10px; border-radius: 8px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab.active { background: rgb(255 255 255 / 0.75); box-shadow: 0 1px 2px rgb(0 0 0 / 0.08); }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: #7b7395; margin: 14px 10px 6px; }
  main { position: absolute; left: 232px; top: 8px; right: 8px; bottom: 8px; border-radius: 10px; background: #111; color: #888; display: grid; place-items: center; }
  #keys { position: fixed; left: 12px; bottom: 10px; font-size: 11px; color: #7b7395; }
</style>
</head>
<body>
<div class="drag"></div>
<aside>
  <div class="label">Pinned</div>
  <div class="tab">Mail</div>
  <div class="tab">Calendar</div>
  <div class="label">Today</div>
  <div class="tab active">Netflix</div>
  <div class="tab">Wikipedia</div>
  <div class="tab">MDN Web Docs</div>
</aside>
<main>the Widevine player goes here</main>
<div id="keys"></div>
<script>
  const seen = [];
  document.addEventListener('keydown', (e) => { seen.push(e.key); document.getElementById('keys').textContent = seen.slice(-8).join(' '); });
</script>
</body>
</html>
