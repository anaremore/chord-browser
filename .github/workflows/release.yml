name: Release

# Every OS and architecture is packaged on its own native runner, installed or
# opened the way a user would, and smoke-tested (ARCHITECTURE.md §15). A `v*` tag
# also collects the files into a draft GitHub Release; a maintainer reviews and
# publishes it.
#
# Code signing switches itself on (ARCHITECTURE.md §15.2, docs/releasing/signing.md).
# A tag build signs, notarizes and checks the signatures once the signing secrets
# are in the protected `release` environment. Without them, and in manual runs,
# builds are unsigned, with an ad-hoc signature on macOS.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Tag builds read the signing secrets, so they run in the protected `release` environment and
    # wait for its reviewers. Manual runs from a branch get no environment and no secrets: unsigned.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    # Notarization waits on Apple: usually minutes, sometimes much longer.
    timeout-minutes: ${{ matrix.platform == 'mac' && 90 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest, platform: win, arch: x64 }
          - { name: Windows arm64, os: windows-11-arm, platform: win, arch: arm64 }
          - { name: macOS arm64, os: macos-26, platform: mac, arch: arm64 }
          - { name: macOS x64, os: macos-15-intel, platform: mac, arch: x64 }
          - { name: Linux x64, os: ubuntu-24.04, platform: linux, arch: x64 }
          - { name: Linux arm64, os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: The tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match apps/desktop/package.json version $version"
            exit 1
          fi

      # Sets CHORD_SIGNING for the steps below and electron-builder.config.ts. Only whether each
      # secret is set reaches this step, never its value. A half-configured set fails here.
      - name: Choose how to sign
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          REQUIRE_SIGNING: ${{ vars.CHORD_REQUIRE_SIGNING }}
          HAS_MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK != '' }}
          HAS_MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD != '' }}
          HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
          HAS_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID != '' }}
          HAS_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
          HAS_AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID != '' }}
          HAS_AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID != '' }}
          HAS_AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          HAS_AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT != '' }}
          HAS_AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
          HAS_AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE != '' }}
          HAS_WIN_PUBLISHER_NAME: ${{ vars.WIN_PUBLISHER_NAME != '' }}
          HAS_WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK != '' }}
          HAS_WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD != '' }}
        run: node apps/desktop/scripts/signing-mode.mjs

      # Google's Safe Browsing API key goes into the build (electron.vite.config.ts, ARCHITECTURE.md §14.5).
      # It's a secret of the protected `release` environment, so manual runs build without it. Only whether
      # it's set reaches this step. Without it the build still works; Settings shows Safe Browsing as unavailable.
      - name: Check the Safe Browsing key
        shell: bash
        env:
          HAS_SAFE_BROWSING_KEY: ${{ secrets.CHORD_SAFE_BROWSING_KEY != '' }}
        run: |
          if [ "$HAS_SAFE_BROWSING_KEY" != "true" ]; then
            echo "::warning::CHORD_SAFE_BROWSING_KEY isn't set, so this build has no Safe Browsing: Settings → Privacy shows it as unavailable (ARCHITECTURE.md §14.5)."
          fi

      # electron-builder makes the .rpm with the fpm it downloads (it has one for x64 and arm64),
      # and fpm needs rpmbuild.
      - name: Install rpmbuild (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if ! command -v rpmbuild > /dev/null; then
            sudo -E apt-get -o DPkg::Lock::Timeout=300 update
            sudo -E apt-get -o DPkg::Lock::Timeout=300 install -y --no-install-recommends rpm
          fi
          rpmbuild --version

      - name: Package
        if: env.CHORD_SIGNING == 'none'
        env:
          CHORD_SAFE_BROWSING_KEY: ${{ secrets.CHORD_SAFE_BROWSING_KEY }}
        run: pnpm --filter @chord/desktop package --${{ matrix.platform }} --${{ matrix.arch }}

      - name: Package, signed and notarized (macOS)
        if: env.CHORD_SIGNING == 'developer-id'
        shell: bash
        env:
          CHORD_SAFE_BROWSING_KEY: ${{ secrets.CHORD_SAFE_BROWSING_KEY }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # electron-builder 26 hands APPLE_API_KEY to notarytool as a path, so the key goes in a file.
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          (umask 077 && printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY")
          unset APPLE_API_KEY_CONTENT
          pnpm --filter @chord/desktop package --mac --${{ matrix.arch }}

      - name: Package, signed with Artifact Signing (Windows)
        if: env.CHORD_SIGNING == 'artifact-signing'
        env:
          CHORD_SAFE_BROWSING_KEY: ${{ secrets.CHORD_SAFE_BROWSING_KEY }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          WIN_PUBLISHER_NAME: ${{ vars.WIN_PUBLISHER_NAME }}
        run: pnpm --filter @chord/desktop package --win --${{ matrix.arch }}

      - name: Package, signed with a certificate (Windows)
        if: env.CHORD_SIGNING == 'certificate'
        env:
          CHORD_SAFE_BROWSING_KEY: ${{ secrets.CHORD_SAFE_BROWSING_KEY }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_PUBLISHER_NAME: ${{ vars.WIN_PUBLISHER_NAME }}
        run: pnpm --filter @chord/desktop package --win --${{ matrix.arch }}

      # Each Windows architecture builds on its own runner, and electron-builder names both
      # manifests latest.yml: name them apart so one release holds both (src/main/update-signing.ts).
      - name: Name the update manifest (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mv apps/desktop/release/latest.yml "apps/desktop/release/latest-win-${{ matrix.arch }}.yml"

      # Install or open each build the way a user would, then smoke-test that copy.
      - name: Install (Windows, silent per-user)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/release -Filter '*-setup.exe' | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter Chord.exe | Select-Object -First 1
          if (-not $exe) { throw 'Chord.exe was not installed' }
          "Installed to $($exe.DirectoryName)"
          "CHORD_APP=$($exe.FullName)" >> $env:GITHUB_ENV
          "FUSES_APP=$($exe.FullName)" >> $env:GITHUB_ENV

      # electron-updater installs an update only if it's signed by the publisher that the
      # installed copy's app-update.yml names, and checks nothing when it names none
      # (ARCHITECTURE.md §14.4). So a signed build must carry valid, timestamped signatures from
      # exactly that publisher, and an unsigned one must name no publisher, or its copies would
      # refuse every unsigned update.
      - name: Check the signatures (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installed = Split-Path $env:CHORD_APP
          $publishers = @()
          $inList = $false
          foreach ($line in Get-Content (Join-Path $installed 'resources\app-update.yml')) {
            if ($line -match '^publisherName:\s*(\S.*)?$') { $inList = $true; if ($Matches[1]) { $publishers += $Matches[1] }; continue }
            if ($inList -and $line -match '^\s+-\s+(.+)$') { $publishers += $Matches[1]; continue }
            $inList = $false
          }
          $publishers = @($publishers | ForEach-Object { $_.Trim() -replace "^'(.*)'$", '$1' -replace "''", "'" -replace '^"(.*)"$', '$1' })
          $files = @(Get-ChildItem apps/desktop/release -Filter '*-setup.exe') + @(Get-Item $env:CHORD_APP, (Join-Path $installed "Uninstall Chord.exe"))
          if ($env:CHORD_SIGNING -eq 'none') {
            if ($publishers.Count -gt 0) { throw "This unsigned build's app-update.yml names a publisher ($($publishers -join ', ')), so its copies would refuse unsigned updates" }
            foreach ($file in $files) { "$($file.Name): $((Get-AuthenticodeSignature -LiteralPath $file.FullName).Status)" }
            'Unsigned on purpose, and no publisher is pinned: in-app updates keep working.'
          } else {
            if ($publishers.Count -eq 0) { throw "A signed build must name its publisher in app-update.yml, or its copies would install an update signed by anyone" }
            "Updates must be signed by: $($publishers -join ' or ')"
            foreach ($file in $files + @(Get-ChildItem $installed -Filter '*.dll')) {
              $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
              $signer = $signature.SignerCertificate
              $name = if ($signer) { $signer.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) } else { '' }
              "$($file.Name): $($signature.Status), signed by '$name', timestamped by '$($signature.TimeStamperCertificate.Subject)'"
              if ($signature.Status -ne 'Valid') { throw "$($file.Name) isn't validly signed: $($signature.StatusMessage)" }
              if (-not $signature.TimeStamperCertificate) { throw "$($file.Name) has no timestamp, so its signature would lapse with the certificate" }
              if ($publishers -notcontains $name -and $publishers -notcontains $signer.Subject) { throw "$($file.Name) is signed by '$($signer.Subject)', not by $($publishers -join ' or ')" }
            }
          }

      - name: Check the ad-hoc signature (macOS)
        if: runner.os == 'macOS' && env.CHORD_SIGNING == 'none'
        shell: bash
        run: |
          app="$(ls -d "$PWD"/apps/desktop/release/mac*/Chord.app)"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | grep -E '^(Identifier|Format|Signature|TeamIdentifier)='
          for dmg in apps/desktop/release/*.dmg; do hdiutil verify "$dmg"; done
          echo "CHORD_APP=$app/Contents/MacOS/Chord" >> "$GITHUB_ENV"
          echo "FUSES_APP=$app" >> "$GITHUB_ENV"

      # The built app, and the copies people download in the .dmg and the .zip: Developer ID with
      # the hardened runtime, accepted by Gatekeeper as notarized, with the ticket stapled so it
      # opens offline too.
      - name: Check the Developer ID signature and notarization (macOS)
        if: runner.os == 'macOS' && env.CHORD_SIGNING == 'developer-id'
        shell: bash
        run: |
          check() {
            codesign --verify --deep --strict --verbose=2 "$1"
            info="$(codesign --display --verbose=4 "$1" 2>&1)"
            grep -E '^(Identifier|Authority|TeamIdentifier|Timestamp)=|^CodeDirectory ' <<< "$info"
            grep -q '^Authority=Developer ID Application: ' <<< "$info" || { echo "::error::$1 isn't signed with a Developer ID"; exit 1; }
            grep -Eq '^CodeDirectory .*flags=0x[0-9a-f]+\([^)]*runtime' <<< "$info" || { echo "::error::$1 doesn't use the hardened runtime"; exit 1; }
            verdict="$(spctl --assess --type execute -vv "$1" 2>&1)"
            echo "$verdict"
            grep -q '^source=Notarized Developer ID$' <<< "$verdict" || { echo "::error::Gatekeeper doesn't see $1 as notarized"; exit 1; }
            xcrun stapler validate "$1"
          }
          app="$(ls -d "$PWD"/apps/desktop/release/mac*/Chord.app)"
          check "$app"
          for dmg in apps/desktop/release/*.dmg; do
            hdiutil verify "$dmg"
            mount="$(mktemp -d)"
            hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$mount" "$dmg" > /dev/null
            check "$mount/Chord.app"
            hdiutil detach "$mount" > /dev/null || hdiutil detach -force "$mount" > /dev/null
          done
          for zip in apps/desktop/release/*.zip; do
            unzipped="$(mktemp -d)"
            ditto -x -k "$zip" "$unzipped"
            check "$unzipped/Chord.app"
          done
          echo "CHORD_APP=$app/Contents/MacOS/Chord" >> "$GITHUB_ENV"
          echo "FUSES_APP=$app" >> "$GITHUB_ENV"

      - name: Install the .deb (Linux)
        if: runner.os == 'Linux'
        # A fresh runner can still be running unattended-upgrades; wait for the dpkg lock.
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -o DPkg::Lock::Timeout=300 update
          sudo -E apt-get -o DPkg::Lock::Timeout=300 install -y --no-install-recommends xvfb ./apps/desktop/release/*.deb
          # electron-builder's script makes it setuid only where user namespaces don't work.
          stat -c '%A %U:%G %n' /opt/Chord/chrome-sandbox
          echo "CHORD_APP=/opt/Chord/chord" >> "$GITHUB_ENV"
          echo "FUSES_APP=/opt/Chord/chord" >> "$GITHUB_ENV"

      - name: Read the fuses back
        shell: bash
        run: npx --yes @electron/fuses@2.1.3 read --app "$FUSES_APP"

      # The OS can offer Chord as the default browser (src/main/default-browser.ts).
      - name: Check the browser registration (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $capabilities = (Get-ItemProperty 'HKCU:\Software\RegisteredApplications').Chord
          if ($capabilities -ne 'Software\Clients\StartMenuInternet\Chord\Capabilities') { throw "RegisteredApplications\Chord is '$capabilities'" }
          $https = (Get-ItemProperty 'HKCU:\Software\Clients\StartMenuInternet\Chord\Capabilities\URLAssociations').https
          if ($https -ne 'ChordHTML') { throw "https is registered as '$https'" }
          $command = (Get-ItemProperty 'HKCU:\Software\Classes\ChordHTML\shell\open\command').'(default)'
          "Links open with: $command"
          if ($command -notlike '*Chord.exe" --single-argument %1') { throw 'Links must reach Chord after --single-argument' }

      - name: Check the browser registration (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: plutil -extract CFBundleURLTypes json -o - "${CHORD_APP%/MacOS/Chord}/Info.plist" | tee /dev/stderr | grep -q '"https"'

      - name: Check the browser registration (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          desktop=/usr/share/applications/com.chordbrowser.Chord.desktop
          cat "$desktop"
          grep -E '^MimeType=.*x-scheme-handler/https' "$desktop"
          grep -E '^Exec=.* %U$' "$desktop"

      - name: Smoke test
        if: runner.os != 'Linux'
        run: pnpm --filter @chord/desktop test:packaged

      - name: Smoke test (Linux, installed .deb)
        if: runner.os == 'Linux'
        # No sysctl change here: on Ubuntu 24.04 the .deb's AppArmor profile is
        # what lets Chromium's sandbox use user namespaces.
        run: xvfb-run -a pnpm --filter @chord/desktop test:packaged

      - name: Smoke test (Linux, AppImage)
        if: runner.os == 'Linux'
        # An AppImage gets no AppArmor profile, so allow user namespaces as a
        # user would have to. Extract-and-run avoids depending on FUSE.
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          export CHORD_APP="$(ls "$PWD"/apps/desktop/release/*.AppImage)"
          xvfb-run -a pnpm --filter @chord/desktop test:packaged

      # The .rpm installed with dnf in a Fedora container, its files checked, and the same smoke
      # test run there, on Chromium's setuid sandbox helper (the script says how and why).
      - name: Smoke test (Linux, .rpm in Fedora)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: scripts/ci/rpm-smoke.sh apps/desktop/release/*.rpm

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: chord-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*-setup.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/latest-win-*.yml
            apps/desktop/release/latest-linux*.yml

      - name: Upload failure details
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failures-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/desktop/test-results/
            apps/desktop/release/builder-debug.yml
          if-no-files-found: ignore

  release:
    name: Draft the GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    # The update-signing key lives in this environment; protect it with required reviewers.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: chord-*
          path: dist
          merge-multiple: true

      # Installed copies install an update only if its manifest carries this signature
      # (ARCHITECTURE.md §14.4). Without the key, they only say the version is out.
      - name: Sign the update manifests
        env:
          CHORD_UPDATE_SIGNING_KEY: ${{ secrets.CHORD_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$CHORD_UPDATE_SIGNING_KEY" ]; then
            echo "::warning::CHORD_UPDATE_SIGNING_KEY isn't set, so this release's copies will only say it's out (docs/releasing/patch-runbook.md, Update signing key)."
          else
            node apps/desktop/scripts/sign-update-manifests.mjs dist
          fi

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          # Whether the builds were signed. The package jobs stop on a half-configured set, so one secret tells.
          MAC_SIGNED: ${{ secrets.MAC_CSC_LINK != '' }}
          WIN_SIGNED: ${{ secrets.AZURE_CLIENT_SECRET != '' || secrets.WIN_CSC_LINK != '' }}
        run: |
          steps="see [Try the preview](https://github.com/${GITHUB_REPOSITORY}#try-the-preview) for what to click"
          case "$MAC_SIGNED,$WIN_SIGNED" in
            true,true) signing="Signed for Windows, and signed and notarized for macOS." ;;
            true,false) signing="Signed and notarized for macOS. The Windows builds aren't signed yet, so Windows warns before the first launch; $steps." ;;
            false,true) signing="Signed for Windows. The macOS builds aren't signed yet, so macOS warns before the first launch; $steps." ;;
            *) signing="Unsigned preview build. Windows and macOS will warn before the first launch; $steps." ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --prerelease \
            --title "Chord ${GITHUB_REF_NAME#v} (preview)" \
            --generate-notes \
            --notes "$signing Check downloads against SHA256SUMS.txt. What's new: [RELEASE_NOTES.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/RELEASE_NOTES.md)."
