name: CI on main failed

# A failed CI run on main (a push, the nightly run, or a run by hand) opens the issue "Nightly full tier failed on
# main", or comments on the open one: each failed job (its name says the platform), with the tests that failed both
# tries. A workflow of its own, started when CI completes, so it never shows on a pull request's or a merge group's
# checks: as a job in ci.yml it was marked cancelled on every cancelled pull request run.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  report:
    name: Report a failure on main
    if: >-
      github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' &&
      contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event.workflow_run.event)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # This workflow's alone: nothing else can write issues.
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          EVENT: ${{ github.event.workflow_run.event }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TITLE: Nightly full tier failed on main
        run: |
          case "$EVENT" in
            schedule) what="The nightly run" ;;
            push) what="The push to main" ;;
            *) what="A $EVENT run on main" ;;
          esac
          # Every failed job of that run, with its link (its name says the platform), and under each the tests
          # that failed both tries, from Playwright's summary at the end of its log.
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure") | [.id, .name, .html_url] | @tsv' > "$RUNNER_TEMP/failed.tsv"
          failed=''
          while IFS=$'\t' read -r id name url; do
            failed+="- [$name]($url)"$'\n'
            specs="$(gh api "repos/$REPO/actions/jobs/$id/logs" 2>/dev/null | sed -E 's/^[0-9T:.-]+Z //' | tr -d '\r' | awk '
              /^ +[0-9]+ failed$/ { on = 1; next }
              on && /^ +[0-9]+ (flaky|skipped|passed|did not run|interrupted)/ { on = 0 }
              on && /spec\.ts:[0-9]+:[0-9]+/ { sub(/^ +/, ""); print }' | head -n 20 || true)"
            while IFS= read -r spec; do [ -n "$spec" ] && failed+="  - \`${spec//\`/}\`"$'\n'; done <<< "$specs"
          done < "$RUNNER_TEMP/failed.tsv"
          failed="${failed:-- (none listed: see the run)}"
          body="$what failed at ${SHA:0:7}: $RUN_URL

          Failed jobs, by platform, with the tests that failed both tries:
          $failed

          Rerun the failed jobs to tell a flake from a bug. Close this issue once main is green again: the next failure opens a new one."
          # An API error fails the job rather than open a second issue.
          number="$(gh issue list --repo "$REPO" --state open --limit 200 --json number,title --jq '[.[] | select(.title == env.TITLE)][0].number // ""')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "$body"
            echo "Commented on #$number."
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$body"
          fi
