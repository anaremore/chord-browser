name: Spike S14 (Widevine player)

# Spike S14 (docs/decisions/S14-widevine-player.md): spikes/widevine-player on
# GitHub's Windows and macOS runners, which a person's desktop must never be
# used for (the run opens windows and moves the mouse). Only pushes to the
# spike's own branch run it; results are uploaded as artifacts. Not part of CI.
on:
  push:
    branches: [agent/widevine-spike]

permissions:
  contents: read

concurrency:
  group: widevine-spike
  cancel-in-progress: true

jobs:
  spike:
    name: S14 · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest }
          - { name: macOS arm64, os: macos-26 }
          - { name: Linux x64 · X11, os: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: spikes/widevine-player
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Linux display and sandbox
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 update
          sudo -E apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 install -y --no-install-recommends openbox xvfb
          # Chromium's sandbox needs unprivileged user namespaces (as in ci.yml).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.core_pattern=core

      # ECS, stock Electron and koffi, each checked against its release's SHA-256, in a folder of their own.
      - name: Fetch the runtimes
        shell: bash
        run: node spikes/widevine-player/tools/fetch.mjs --dest "$RUNNER_TEMP/wv-runtime"

      - name: Run (Windows, macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: node spikes/widevine-player/run.mjs --runtime "$RUNNER_TEMP/wv-runtime" --out "$RUNNER_TEMP/wv-results" --work "$RUNNER_TEMP/wv-work"

      - name: Run (Linux, Xvfb with openbox)
        if: runner.os == 'Linux'
        run: |
          ulimit -c 0
          xvfb-run -a -s "-screen 0 1920x1080x24" sh -c '
            ready="$(mktemp -u)"
            openbox --startup "touch $ready" &
            for i in $(seq 1 100); do [ -e "$ready" ] && break; sleep 0.1; done
            node spikes/widevine-player/run.mjs --runtime "$RUNNER_TEMP/wv-runtime" --out "$RUNNER_TEMP/wv-results" --work "$RUNNER_TEMP/wv-work"
          '

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: s14-${{ matrix.os }}
          path: ${{ runner.temp }}/wv-results
          if-no-files-found: warn
          retention-days: 14
