name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run the whole matrix on any branch by hand (gh workflow run ci.yml --ref <branch>).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Every commit on main gets a full run; only superseded pull-request runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Typecheck · lint · unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  e2e:
    name: E2E · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest }
          - { name: Windows arm64, os: windows-11-arm }
          - { name: macOS arm64, os: macos-26 }
          - { name: macOS x64, os: macos-15-intel }
          - { name: Linux x64 · X11, os: ubuntu-24.04, display: x11 }
          - { name: Linux x64 · Wayland, os: ubuntu-24.04, display: wayland }
          - { name: Linux arm64 · X11, os: ubuntu-24.04-arm, display: x11 }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The packages below, kept between runs: the mirror has been slow enough to time the step out.
      - name: Cache display-server packages
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-${{ matrix.os }}-${{ matrix.display }}-v1

      - name: Linux display servers
        if: runner.os == 'Linux'
        # A fresh runner can still be running unattended-upgrades; wait for
        # the dpkg lock rather than hang, and never prompt.
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Runner images ship Xvfb. X11 jobs add a window manager: a desktop always has one, and
          # without it no window is ever granted fullscreen (or activated the way a real one is).
          # The Wayland job installs Weston, which is its own.
          if ! command -v Xvfb >/dev/null; then NEED="xvfb"; fi
          if [ "${{ matrix.display }}" = "x11" ] && ! command -v openbox >/dev/null; then NEED="$NEED openbox"; fi
          if [ "${{ matrix.display }}" = "wayland" ]; then NEED="$NEED weston"; fi
          if [ -n "$NEED" ]; then
            ARCHIVES="$HOME/apt-archives"
            mkdir -p "$ARCHIVES/partial"
            sudo -E apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 update
            # Packages already in the cache aren't downloaded again.
            sudo -E apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 -o Dir::Cache::Archives="$ARCHIVES" install -y --no-install-recommends $NEED
            sudo chown -R "$(id -u):$(id -g)" "$ARCHIVES"
          fi
          # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's
          # sandbox needs. Allow them on the test runner so E2E keeps the
          # sandbox on (packages ship an AppArmor profile instead).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: E2E (X11, Xvfb with openbox)
        if: matrix.display == 'x11'
        run: |
          xvfb-run -a sh -c '
            ready="$(mktemp -u)"
            openbox --startup "touch $ready" &
            for i in $(seq 1 100); do [ -e "$ready" ] && break; sleep 0.1; done
            [ -e "$ready" ] || { echo "openbox did not start"; exit 1; }
            pnpm --filter @chord/desktop test:e2e
          '

      - name: E2E (Wayland, headless Weston)
        if: matrix.display == 'wayland'
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=wayland-chord --idle-time=0 &
          for i in $(seq 1 50); do [ -S "$XDG_RUNTIME_DIR/wayland-chord" ] && break; sleep 0.1; done
          unset DISPLAY
          export WAYLAND_DISPLAY=wayland-chord XDG_SESSION_TYPE=wayland
          pnpm --filter @chord/desktop test:e2e

      - name: E2E
        if: runner.os != 'Linux'
        run: pnpm --filter @chord/desktop test:e2e

      - name: Upload design QA captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: captures-${{ matrix.os }}${{ matrix.display && format('-{0}', matrix.display) || '' }}
          path: apps/desktop/test-results/captures/
          if-no-files-found: ignore

      - name: Upload failure details
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures-${{ matrix.os }}${{ matrix.display && format('-{0}', matrix.display) || '' }}
          path: apps/desktop/test-results/
