name: CI

on:
  # Every push to main runs everything. A pull request that changes only docs or the website skips the slow
  # jobs instead (the `changes` job): no `paths-ignore` here, which would leave such a pull request no status at all.
  push:
    branches: [main]
  pull_request:
  # Run the whole matrix on any branch by hand (gh workflow run ci.yml --ref <branch>).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per pull request: a new push cancels the run it replaces. Every other run (main, a run by hand)
  # has a group of its own, so it's never cancelled, and never waits behind or replaces another run.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether anything but docs changed. Only a pull request can skip anything: the website (site/) is built and
  # deployed by Clank, and no test reads the docs, the mocks or any Markdown file, so a pull request that changes
  # only those skips E2E, Chord Player and the password detector's corpora. Typecheck, lint and unit tests still run.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      # A pull request's run checks out its merge commit: its first parent is the base branch as it is now,
      # so the diff between the two is exactly what merging the pull request changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Anything but docs?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "A $EVENT run: everything runs."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$(git rev-list --parents -n 1 HEAD | wc -w)" = 3 ] || { echo "::error::HEAD isn't the pull request's merge commit"; exit 1; }
          # --no-renames: a file moved lists both its paths, so a test moved into docs/ still counts as code.
          git diff --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/changed"
          code=false
          while IFS= read -r file; do
            case "$file" in
              # Test fixtures are code, Markdown or not.
              apps/*/test/* | packages/*/test/*) code=true; echo "Test file: $file"; break ;;
              *.md | docs/* | site/* | mocks/*) ;;
              *) code=true; echo "Not docs: $file"; break ;;
            esac
          done < "$RUNNER_TEMP/changed"
          echo "$(wc -l < "$RUNNER_TEMP/changed") files changed; anything but docs: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  checks:
    name: Typecheck · lint · unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # The unit perf suite (*.perf.test.ts, docs/testing/performance.md): timed tests, one file at a time, so a budget
      # measures Chord and not the rest of the suite sharing the CPUs. pnpm test leaves them out.
      - run: pnpm test:perf
      # 5,000 passwords into a vault of 500, alone so nothing else shares the CPUs: chord-data's longest task during
      # the import is held to 100 ms (S17, Phase 2: import and export; measured 9.4 ms here, 10.6 ms on an SSD and 40 ms
      # on a slower drive on Windows), so a tenfold regression fails.
      - name: Password import's performance budget
        run: pnpm exec vitest run packages/data/test/password-transfer.test.ts -t "rows"
        env:
          CHORD_PASSWORD_PERF: '1'

  # The password detector on DuckDuckGo's corpus of real sites' forms, in Playwright's own headless Chromium
  # (apps/desktop/test/forms; S17 §13 layer 2), held to its baseline. The corpus is a pinned, hash-checked
  # download, kept in this job's cache and never in the repository or a release (decided 2026-11-15).
  # Bitwarden's test-the-web is the next job's, not this one's.
  forms:
    name: Password detector · corpus
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache the corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/test/forms/.cache/ddg-*
          key: forms-corpus-${{ hashFiles('apps/desktop/test/forms/corpus.ts') }}
      - name: Cache Playwright's Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - run: pnpm --filter @chord/desktop exec playwright install --only-shell chromium
      - run: pnpm --filter @chord/desktop test:forms --project corpus
      - name: Upload the corpus score
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forms-score
          path: apps/desktop/test-results/forms/score.json
          if-no-files-found: ignore

  # The password detector on Bitwarden's test-the-web (GPL-3.0: tested against, never vendored), held to its
  # own baseline (test/forms/ttw.spec.ts). Its site is a pinned, hash-checked download that's built here
  # (test/forms/ttw.ts): `npm ci` of its locked packages, then `docusaurus build`. That runs a third party's
  # code, so this job is kept apart from anything a release uses:
  # - the checkout keeps no credentials (no GITHUB_TOKEN in .git/config);
  # - no pnpm-store cache: setup-node's `cache: pnpm` is what release.yml restores, so this job installs
  #   with a cold store and saves none (`package-manager-cache: false` too, so none is turned on for it);
  # - Playwright's Chromium is restored, never saved;
  # - the one cache it saves, `.cache/ttw-*` (the built site), is read by this job alone.
  # If the site can't be fetched or built it skips with a warning on pull requests, and fails on a push to
  # main or a run by hand (CHORD_TTW_REQUIRED), where a skip would hide a lasting breakage.
  forms-ttw:
    name: Password detector · test-the-web
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Cache test-the-web's build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/test/forms/.cache/ttw-*
          key: forms-ttw-${{ hashFiles('apps/desktop/test/forms/ttw.ts') }}
      - name: Restore Playwright's Chromium
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - run: pnpm --filter @chord/desktop exec playwright install --only-shell chromium
      - run: pnpm --filter @chord/desktop test:forms --project ttw
        env:
          CHORD_TTW_REQUIRED: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
      - name: Upload the test-the-web score
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forms-ttw-score
          path: apps/desktop/test-results/forms/ttw-score.json
          if-no-files-found: ignore

  # Chord Player (apps/player): packaged on castLabs ECS per OS and smoke-tested, with ECS's
  # development signature. Only a player release is VMP-signed (player-release.yml).
  player:
    name: Chord Player
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/player.yml

  # E2E on every OS, each split into shards (Playwright's --shard, which splits by file, keeping each file's tests
  # together and in order) that run side by side on their own runners. Each shard sets its runner up in full.
  # macOS has 2 shards, the rest 3: GitHub's free plan runs 5 macOS jobs at a time (and 20 jobs in all), and Chord
  # Player takes 2 of those 5, so a third macOS shard would wait for a whole shard to finish.
  # The `E2E` job below is the one status that says whether they all passed.
  e2e-shard:
    name: E2E · ${{ matrix.name }} · ${{ matrix.shard }}/${{ matrix.shards }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    # A whole suite took 30 to 46 minutes. --shard splits by test count, not time, so a macOS shard can hold
    # well over half of it (28 minutes on Intel, 2026-11-22), and Intel varies most. Elsewhere a shard took up to
    # 17 minutes. These limits only have to catch a hung job.
    timeout-minutes: ${{ startsWith(matrix.os, 'macos') && 60 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest, shard: 1, shards: 3 }
          - { name: Windows x64, os: windows-latest, shard: 2, shards: 3 }
          - { name: Windows x64, os: windows-latest, shard: 3, shards: 3 }
          - { name: Windows arm64, os: windows-11-arm, shard: 1, shards: 3 }
          - { name: Windows arm64, os: windows-11-arm, shard: 2, shards: 3 }
          - { name: Windows arm64, os: windows-11-arm, shard: 3, shards: 3 }
          - { name: macOS arm64, os: macos-26, shard: 1, shards: 2 }
          - { name: macOS arm64, os: macos-26, shard: 2, shards: 2 }
          - { name: macOS x64, os: macos-15-intel, shard: 1, shards: 2 }
          - { name: macOS x64, os: macos-15-intel, shard: 2, shards: 2 }
          - { name: Linux x64 · X11, os: ubuntu-24.04, display: x11, shard: 1, shards: 3 }
          - { name: Linux x64 · X11, os: ubuntu-24.04, display: x11, shard: 2, shards: 3 }
          - { name: Linux x64 · X11, os: ubuntu-24.04, display: x11, shard: 3, shards: 3 }
          - { name: Linux x64 · Wayland, os: ubuntu-24.04, display: wayland, shard: 1, shards: 3 }
          - { name: Linux x64 · Wayland, os: ubuntu-24.04, display: wayland, shard: 2, shards: 3 }
          - { name: Linux x64 · Wayland, os: ubuntu-24.04, display: wayland, shard: 3, shards: 3 }
          - { name: Linux arm64 · X11, os: ubuntu-24.04-arm, display: x11, shard: 1, shards: 3 }
          - { name: Linux arm64 · X11, os: ubuntu-24.04-arm, display: x11, shard: 2, shards: 3 }
          - { name: Linux arm64 · X11, os: ubuntu-24.04-arm, display: x11, shard: 3, shards: 3 }
    env:
      # Names this shard's artifacts: captures-, perf- and e2e-failures-<runner>[-display]-<shard>of<shards>.
      ARTIFACT_SUFFIX: ${{ matrix.os }}${{ matrix.display && format('-{0}', matrix.display) || '' }}-${{ matrix.shard }}of${{ matrix.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # Electron's own download (its postinstall, install-electron), kept per version, OS and architecture.
      - name: Electron's version
        id: electron
        shell: bash
        run: echo "version=$(node -p "require('./apps/desktop/package.json').devDependencies.electron")" >> "$GITHUB_OUTPUT"
      - name: Cache Electron's download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ steps.electron.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      - run: pnpm install --frozen-lockfile
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
      - run: pnpm build
      # Outside agents' transport (S18) on every OS: the endpoint, the relay, the gate, and on Windows the pipe's DACL
      # (window-owner.exe, just built), on Linux another user refused; and who's calling (M2a: pipe-clients, ss, lsof),
      # looked up for real on each OS. pnpm test runs them on Linux too. Once per OS: in its first shard.
      - name: Agents' transport
        if: matrix.shard == 1
        run: pnpm exec vitest run apps/desktop/test/unit/agents.test.ts apps/desktop/test/unit/agent-peer.test.ts apps/desktop/test/unit/control.test.ts
      # chord-data's perf rows on Windows' disks too, where a sync to disk costs most: a new profile's database (and
      # its migrations committed one by one, as before 2026-11-20, for comparison) and a big import's Undo.
      - name: chord-data's perf rows
        if: runner.os == 'Windows' && matrix.shard == 1
        run: pnpm test:perf packages/data

      # E2E's spelling dictionary: a pinned, hash-checked download served to Chord from this machine
      # (apps/desktop/test/dictionaries.ts), so no test downloads one from Google.
      - name: Cache the spelling dictionary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/test/.cache/dictionaries
          key: dictionaries-${{ hashFiles('apps/desktop/test/dictionaries.ts') }}

      # Chord Player's E2E test (player.spec.ts, Linux and Windows x64) packages the player on castLabs ECS: its checked zip, kept.
      - name: Cache castLabs ECS
        if: (runner.os == 'Linux' || runner.os == 'Windows') && runner.arch == 'X64'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/chord-ecs
          key: ecs-${{ runner.os }}-x64-${{ hashFiles('apps/player/ecs.json') }}

      # The packages below, kept between runs: the mirror has been slow enough to time the step out.
      - name: Cache display-server packages
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ matrix.os }}-${{ matrix.display }}-v2

      - name: Linux display servers
        if: runner.os == 'Linux'
        # A fresh runner can still be running unattended-upgrades; wait for
        # the dpkg lock rather than hang, and never prompt.
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Runner images ship Xvfb. X11 jobs add a window manager: a desktop always has one, and
          # without it no window is ever granted fullscreen (or activated the way a real one is).
          # The Wayland job installs Weston, which is its own.
          if ! command -v Xvfb >/dev/null; then NEED="xvfb"; fi
          if [ "${{ matrix.display }}" = "x11" ] && ! command -v openbox >/dev/null; then NEED="$NEED openbox"; fi
          # xdotool: the system pointer for tests that drag across Chord's views (test/e2e/system-pointer.ts).
          if [ "${{ matrix.display }}" = "x11" ] && ! command -v xdotool >/dev/null; then NEED="$NEED xdotool"; fi
          if [ "${{ matrix.display }}" = "wayland" ]; then NEED="$NEED weston"; fi
          if [ -n "$NEED" ]; then
            ARCHIVES="$HOME/apt-archives"
            mkdir -p "$ARCHIVES/partial"
            sudo -E apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 update
            # Packages already in the cache aren't downloaded again.
            sudo -E apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 -o Dir::Cache::Archives="$ARCHIVES" install -y --no-install-recommends $NEED
            sudo chown -R "$(id -u):$(id -g)" "$ARCHIVES"
          fi
          # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's
          # sandbox needs. Allow them on the test runner so E2E keeps the
          # sandbox on (packages ship an AppArmor profile instead).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # No core dumps. The tests crash pages on purpose, and the runners hand every crash to
          # systemd-coredump through a pipe, which ignores the shell's ulimit and takes long enough
          # over a renderer's core to hang the test that crashed it. A plain file name instead of
          # the pipe makes the E2E steps' `ulimit -c 0` count: nothing is written at all.
          sudo sysctl -w kernel.core_pattern=core

      - name: E2E (X11, Xvfb with openbox)
        if: matrix.display == 'x11'
        run: |
          # No core dumps (see the display servers step).
          ulimit -c 0
          xvfb-run -a sh -c '
            ready="$(mktemp -u)"
            openbox --startup "touch $ready" &
            for i in $(seq 1 100); do [ -e "$ready" ] && break; sleep 0.1; done
            [ -e "$ready" ] || { echo "openbox did not start"; exit 1; }
            pnpm --filter @chord/desktop test:e2e --shard=${{ matrix.shard }}/${{ matrix.shards }}
          '

      - name: E2E (Wayland, headless Weston)
        if: matrix.display == 'wayland'
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=wayland-chord --idle-time=0 &
          for i in $(seq 1 50); do [ -S "$XDG_RUNTIME_DIR/wayland-chord" ] && break; sleep 0.1; done
          unset DISPLAY
          export WAYLAND_DISPLAY=wayland-chord XDG_SESSION_TYPE=wayland
          # No core dumps (see the display servers step).
          ulimit -c 0
          pnpm --filter @chord/desktop test:e2e --shard=${{ matrix.shard }}/${{ matrix.shards }}

      - name: E2E
        if: runner.os != 'Linux'
        run: pnpm --filter @chord/desktop test:e2e --shard=${{ matrix.shard }}/${{ matrix.shards }}

      - name: Upload design QA captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captures-${{ env.ARTIFACT_SUFFIX }}
          path: apps/desktop/test-results/captures/
          if-no-files-found: ignore

      # Performance budgets (test/e2e/perf.spec.ts): times reported here for trends, enforced only on
      # reference hardware; memory and warm launches held to each runner's baseline, which
      # `pnpm --filter @chord/desktop perf:baseline --run <id>` takes from these reports (docs/testing/performance.md).
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-${{ env.ARTIFACT_SUFFIX }}
          path: apps/desktop/test-results/perf.json
          if-no-files-found: ignore

      - name: Upload failure details
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failures-${{ env.ARTIFACT_SUFFIX }}
          path: apps/desktop/test-results/

  # The one E2E status for a pull request: it passes when every shard passed, or when none had to run (a pull
  # request of docs alone), and fails when any shard failed or was cancelled, or what changed couldn't be told.
  e2e:
    name: E2E
    needs: [changes, e2e-shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every shard passed, or none had to run
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          echo "What changed: $CHANGES (anything but docs: ${CODE:-unknown}). Shards: $SHARDS."
          if [ "$CHANGES" != success ]; then echo "::error::Couldn't tell what changed ($CHANGES)"; exit 1; fi
          if [ "$CODE" = true ]; then
            if [ "$SHARDS" != success ]; then echo "::error::E2E shards: $SHARDS"; exit 1; fi
          elif [ "$SHARDS" != skipped ]; then
            echo "::error::Docs alone changed, but the shards were $SHARDS"; exit 1
          fi
