name: CI

# Tiers (the `changes` job picks one, and the platforms each runs):
# - The fast tier, on every pull request push: typecheck, lint, unit tests, E2E on Linux x64 X11, and the password
#   detector's corpora when the detector changed. Quick feedback while a pull request is in review.
# - The merge tier, once per merge of platform-sensitive code (a merge group): the fast tier plus E2E on Windows x64
#   and macOS arm64, and perf.spec.ts on those and Linux x64 X11 (the budgets' platforms). Chord Player when it changed.
# - The full tier, nightly, by hand, with `ready`, and in a merge group that changes Electron: every platform (the
#   merge tier's plus macOS x64, Windows arm64, Linux arm64 and Wayland), perf.spec.ts on each, and Chord Player.
# - None: a push to main that a merge group already tested. Only the checks run.
# The free plan runs about 20 Linux and 5 macOS jobs at once, and one full tier is over 30 jobs, so the full tier
# runs once a night rather than once a merge (decided 2026-11-24); a merge group that isn't platform-sensitive
# runs the fast tier.
# The `E2E` commit status (posted by the `e2e` job) is the merge gate, on pull requests and merge groups alike.
# With main's merge queue (a ruleset; decided 2026-11-24, to cut jobs on the free runners' queue): a pull request
# runs the fast tier only, and its `E2E` passes with it. `gh pr merge <n> --merge --auto` queues it, and the merge
# group runs its tier once, on exactly the commit main gets, so main's push runs only the checks. `ready` is a
# "run the full tier now" escape hatch: adding the label runs it once, on that commit.
# Without a merge queue (until the owner turns it on), as before: a platform-sensitive pull request's `E2E` stays
# pending until the full tier passes (label it `ready`), and a push to main runs the full tier.
# The nightly run and a run by hand run the full tier; a failure on main opens an issue (ci-main-failed.yml). Before a
# release is tagged, the last full run on its commit must be green (docs/releasing/patch-runbook.md, §5).
on:
  # Every push to main runs everything. A pull request that changes only docs or the website skips the slow
  # jobs instead (the `changes` job): no `paths-ignore` here, which would leave such a pull request no status at all.
  push:
    branches: [main]
  pull_request:
    # `labeled`: adding `ready` starts the full tier with no new push. Any other label reruns the tier the pull
    # request already gets (Actions can't filter labels before a run starts, and a run that skipped its jobs
    # would post skipped checks over the real ones). `ready_for_review`: a draft that's already labeled.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  # The merge queue's groups: the full tier, once per merge, on the commit main will get.
  merge_group:
    types: [checks_requested]
  # Every platform on main each night, whatever merged during the day.
  schedule:
    - cron: '0 8 * * *'
  # Run the whole matrix on any branch by hand (gh workflow run ci.yml --ref <branch>), or one platform's E2E alone
  # (a repro): gh workflow run ci.yml --ref <branch> -f platform=windows-x64 -f spec=agents.spec.ts -f grep='snapshot'
  # -f repeat=5. A repro runs that one job (and posts no `E2E` status): no throwaway branch that edits this file.
  workflow_dispatch:
    inputs:
      platform:
        description: One platform's E2E alone (a repro), or all for the full tier
        type: choice
        default: all
        options: [all, linux-x64-x11, linux-x64-wayland, linux-arm64-x11, windows-x64, windows-arm64, macos-arm64, macos-x64]
      spec:
        description: 'A repro''s spec files, space-separated (e.g. agents.spec.ts); empty for every one'
        type: string
        default: ''
      grep:
        description: A repro's test title filter (a regular expression; Playwright's -g)
        type: string
        default: ''
      repeat:
        description: How many times a repro runs each test (Playwright's --repeat-each)
        type: string
        default: '1'

permissions:
  contents: read

concurrency:
  # One group per pull request, and one per merge group's ref (gh-readonly-queue/main/pr-<n>-<sha>): a new push,
  # or the group run again, cancels the run it replaces. Every other run (main, a run by hand) has a group of its
  # own, so it's never cancelled, and never waits behind or replaces another run.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'merge_group' && format('queue-{0}', github.ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  # Whether anything but docs changed. Only a pull request can skip anything: the website (site/) is built and
  # deployed by Clank, and no test reads the docs, the mocks or any Markdown file, so a pull request that changes
  # only those skips E2E, Chord Player and the password detector's corpora. Typecheck, lint and unit tests still run.
  # And whether a pull request is platform-sensitive: whether its `E2E` status needs the full tier (the `e2e` job).
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Whether a merge group already tested a commit pushed to main.
      actions: read
    outputs:
      # A tier of none runs no E2E: as a pull request of docs alone does.
      code: ${{ steps.tier.outputs.tier != 'none' && steps.tier.outputs.tier != 'checks' && steps.diff.outputs.code || 'false' }}
      tier: ${{ steps.tier.outputs.tier }}
      queue: ${{ steps.queue.outputs.queue }}
      # The tier's other platforms, as matrices for `e2e-full` and `e2e-perf` (the `Which tier?` step).
      shards: ${{ steps.tier.outputs.shards }}
      perf: ${{ steps.tier.outputs.perf }}
      player: ${{ steps.tier.outputs.player }}
      platform: ${{ steps.platform.outputs.platform }}
      forms: ${{ steps.forms.outputs.forms }}
    steps:
      # Whether main has a merge queue (a ruleset with the merge queue rule), which changes what a pull request's
      # `E2E` needs and what a push to main runs; if it can't be told, no queue, the stricter way. And whether a
      # push to main is a commit a merge group already tested and passed: then it runs nothing more.
      - name: Merge queue?
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          queue="$(gh api "repos/$REPO/rules/branches/main" --jq '[.[] | select(.type == "merge_queue")] | length' 2>/dev/null || echo 0)"
          if [ "${queue:-0}" -gt 0 ]; then queue=true; else queue=false; fi
          echo "Main has a merge queue: $queue"
          echo "queue=$queue" >> "$GITHUB_OUTPUT"
          tested=false
          if [ "$EVENT" = push ]; then
            n="$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&event=merge_group&status=success" --jq '.total_count' 2>/dev/null || echo 0)"
            if [ "${n:-0}" -gt 0 ]; then tested=true; fi
            echo "Tested in a merge group already: $tested"
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
      # A pull request's run checks out its merge commit: its first parent is the base branch as it is now, so the
      # diff between the two is exactly what merging the pull request changes. A merge group's diff runs from its
      # base (main, or the group ahead of it in the queue) to its head: every pull request in it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Does E2E need to run?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ "$EVENT" != pull_request ] && [ "$EVENT" != merge_group ]; then
            echo "A $EVENT run: everything runs."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = merge_group ]; then
            git fetch --quiet --no-tags --depth=1 origin "$GROUP_BASE"
            base="$GROUP_BASE"
          else
            [ "$(git rev-list --parents -n 1 HEAD | wc -w)" = 3 ] || { echo "::error::HEAD isn't the pull request's merge commit"; exit 1; }
            base="$(git rev-parse HEAD^1)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          # --no-renames: a file moved lists both its paths, so a test moved into docs/ still counts as code.
          git diff --name-only --no-renames "$base" HEAD > "$RUNNER_TEMP/changed"
          code=false
          while IFS= read -r file; do
            case "$file" in
              # What only the checks job tests (typecheck, lint, unit tests, invariants): unit tests, the local
              # container runner and dev scripts, the agents' skills, Renovate's config. No E2E reads these.
              apps/*/test/unit/* | apps/*/test/web/* | packages/*/test/* | scripts/test/* | scripts/dev/* | \
              scripts/e2e-linux/* | .claude/* | renovate.json) ;;
              # E2E's own tests and fixtures, Markdown or not.
              apps/*/test/*) code=true; echo "E2E's tests or fixtures: $file"; break ;;
              *.md | docs/* | site/* | mocks/*) ;;
              *) code=true; echo "Code E2E runs: $file"; break ;;
            esac
          done < "$RUNNER_TEMP/changed"
          echo "$(wc -l < "$RUNNER_TEMP/changed") files changed; E2E needed: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      # How much review reads (scripts/ci/pr-size.mjs): over about 1,500 changed lines, without lockfiles, fixtures,
      # docs and vendored lists, a warning on the run and in its summary. Never a failure.
      - name: How big?
        if: github.event_name == 'pull_request'
        run: git diff --numstat --no-renames HEAD^1 HEAD | node scripts/ci/pr-size.mjs
      # Whether the pull request is platform-sensitive: whether its diff touches code that behaves differently by
      # OS. Its `E2E` status then needs the full tier; otherwise the fast tier is enough (the `e2e` job).
      - name: Platform-sensitive?
        id: platform
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE: ${{ steps.diff.outputs.base }}
        run: |
          base="$BASE" head=HEAD
          # ── What makes a change platform-sensitive ───────────────────────────────────────────────────────
          # The one list. A change is platform-sensitive when it touches code that behaves differently by OS,
          # going by where 2026-10-15 to 2026-11-24's platform-only fixes landed (about 40 of 945 commits).
          # When unsure, a path goes in: a needless full tier costs 11 minutes, a missed platform bug a release.
          sensitive_path() {
            case "$1" in
              # Filter lists the build bundles: data, the same on every OS.
              apps/desktop/build/ad-blocking/*) ;;
              # The workflows and CI's own scripts: they pick what runs where.
              .github/*| scripts/ci/*) echo "CI itself" ;;
              # Packaging: electron-builder, build resources (icons, entitlements, the installer, window-owner.cs),
              # the build and packaging scripts, Flatpak.
              apps/desktop/build/* | apps/desktop/electron-builder.config.ts | apps/desktop/electron.vite.config.ts | \
              apps/desktop/scripts/* | flatpak/*) echo "packaging" ;;
              # Native code and helpers, anywhere.
              *.cs | *.c | *.cc | *.cpp | *.h | *.m | *.mm | *.rs | *.swift | *.ps1 | *.psm1 | *.nsh | *.plist) echo "native code" ;;
              # Chord Player and the channel to it: castLabs ECS per OS, a window docked by HWND on Windows.
              apps/player/* | packages/player-protocol/src/* | apps/desktop/src/main/player/*) echo "Chord Player" ;;
              # Main's windows, views, focus, fullscreen, keyboard and input, and what talks to the OS.
              apps/desktop/src/main/index.ts | apps/desktop/src/main/browser.ts | apps/desktop/src/main/window.ts | \
              apps/desktop/src/main/platform.ts | apps/desktop/src/main/bounds.ts | apps/desktop/src/main/view-page.ts | \
              apps/desktop/src/main/peek.ts | apps/desktop/src/main/mini-window.ts | apps/desktop/src/main/settings-window.ts | \
              apps/desktop/src/main/devtools.ts | apps/desktop/src/main/auto-pip.ts | apps/desktop/src/main/keyboard.ts | \
              apps/desktop/src/main/shortcut-overrides.ts | apps/desktop/src/main/menu.ts | apps/desktop/src/main/context-menu.ts | \
              apps/desktop/src/main/control/input.ts | apps/desktop/src/main/screen-share.ts | apps/desktop/src/main/app-icon.ts | \
              apps/desktop/src/main/app-badge.ts | apps/desktop/src/main/default-browser.ts | apps/desktop/src/main/os-links.ts | \
              apps/desktop/src/main/identity.ts | apps/desktop/src/main/drm.ts | apps/desktop/src/main/spellcheck.ts | \
              apps/desktop/src/main/idle.ts | apps/desktop/src/main/update-installer.ts) echo "main: windows, focus, input or the OS" ;;
              # Outside agents' transport: the pipe or socket, its DACL, and who's calling (pipe-clients, ss, lsof).
              apps/desktop/src/main/agents/peer* | apps/desktop/src/main/agents/parent.ts | \
              apps/desktop/src/main/agents/endpoint.ts | apps/desktop/src/main/agents/relay-folder.ts | \
              apps/desktop/test/unit/agents.test.ts | apps/desktop/test/unit/agent-peer.test.ts | apps/desktop/test/unit/control.test.ts) echo "agents' transport" ;;
              # The E2E harness's platform-specific parts: Playwright's configs, the packaged smoke test, bare
              # Electron, the system pointer, per-runner perf baselines, the Linux container.
              apps/desktop/playwright.config.ts | apps/desktop/playwright.packaged.config.ts | apps/desktop/test/packaged/* | \
              apps/desktop/test/fixtures/bare-electron/* | apps/desktop/test/e2e/system-pointer.ts | \
              apps/desktop/test/e2e/baselines.ts | apps/desktop/test/e2e/perf-baseline.json | apps/desktop/test/run-temp.ts | \
              scripts/e2e-linux/*) echo "E2E harness" ;;
              # How packages install: build scripts allowed to run, Electron's download.
              pnpm-workspace.yaml | .npmrc | */.npmrc) echo "installing" ;;
            esac
          }
          # Electron, Chromium and their tooling: a manifest or the lockfile, when a changed line names electron.
          electron_re='electron'
          # Code that branches on the OS or the architecture, in any file: a changed line that names one.
          os_re="process\.(platform|arch)|os\.platform\(|\bplatform\s*[!=]==|\bis(Mac|Windows|Win|Linux)\b|['\"](darwin|win32|linux|arm64|x64)['\"]|runner\.(os|arch)"
          # The file's changed lines, without the diff's headers. Each grep reads to the end: no early exit, so
          # pipefail sees no broken pipe.
          changed_lines() {
            git diff --no-renames -U0 "$base" "$head" -- "$1" | { grep -E '^[-+]' || true; } | { grep -vE '^(\+\+\+|---) ' || true; } > "$RUNNER_TEMP/lines"
          }
          # ─────────────────────────────────────────────────────────────────────────────────────────────────
          : > "$RUNNER_TEMP/platform"
          while IFS= read -r file; do
            why="$(sensitive_path "$file")"
            if [ -z "$why" ]; then
              case "$file" in
                package.json | */package.json | pnpm-lock.yaml)
                  changed_lines "$file"
                  if grep -qiE "$electron_re" "$RUNNER_TEMP/lines"; then why="Electron's version or tooling"; fi ;;
              esac
            fi
            if [ -z "$why" ]; then
              case "$file" in
                *.md | docs/* | site/* | mocks/* | spikes/*) ;;
                *)
                  changed_lines "$file"
                  if grep -qE "$os_re" "$RUNNER_TEMP/lines"; then why="a changed line branches on the OS"; fi ;;
              esac
            fi
            if [ -n "$why" ]; then echo "$file ($why)" >> "$RUNNER_TEMP/platform"; fi
          done < "$RUNNER_TEMP/changed"
          if [ -s "$RUNNER_TEMP/platform" ]; then platform=true; else platform=false; fi
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          # Electron's version changes every platform at once: a merge group with it runs the full tier.
          if grep -q "(Electron's version" "$RUNNER_TEMP/platform"; then echo "electron=true" >> "$GITHUB_OUTPUT"; fi
          if grep -q "(Chord Player)" "$RUNNER_TEMP/platform"; then echo "player=true" >> "$GITHUB_OUTPUT"; fi
          if [ "$platform" = true ]; then
            echo "Platform-sensitive, because of $(wc -l < "$RUNNER_TEMP/platform") of the changed files:"
            cat "$RUNNER_TEMP/platform"
          else
            echo "Not platform-sensitive: none of the changed files."
          fi
      # The tier. A pull request's labels and draft state are the event's: a run re-run by hand keeps the tier it had.
      # With a merge queue, a pull request always gets the fast tier, except the run the `ready` label itself starts
      # (the escape hatch: the full tier now, once). Without one, as before: `ready` (and not a draft) runs the full
      # tier on every push, and so does a platform-sensitive pull request of Renovate's (Electron's), so it can
      # automerge.
      - name: Which tier?
        id: tier
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          READY: ${{ contains(github.event.pull_request.labels.*.name, 'ready') }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          REPRO: ${{ github.event_name == 'workflow_dispatch' && inputs.platform != 'all' && inputs.platform || '' }}
          PLATFORM: ${{ steps.platform.outputs.platform }}
          ELECTRON: ${{ steps.platform.outputs.electron }}
          PLAYER: ${{ steps.platform.outputs.player }}
          QUEUE: ${{ steps.queue.outputs.queue }}
          TESTED: ${{ steps.queue.outputs.tested }}
        run: |
          if [ "$EVENT" = pull_request ] && [ "$DRAFT" = true ] && [ "$READY" = true ]; then
            # Said loudly: a draft runs the checks only, so `ready` on one would otherwise wait for E2E that never comes.
            echo "::error::Labeled ready but still a draft: mark it ready for review (gh pr ready <n>), and the label runs every platform"
            exit 1
          fi
          if [ "$EVENT" = push ] && [ "$TESTED" = true ]; then tier=none; why="a merge group already tested this commit"
          elif [ -n "$REPRO" ]; then tier=repro; why="a repro by hand: $REPRO's E2E alone"
          elif [ "$EVENT" = merge_group ] && [ "$ELECTRON" = true ]; then tier=full; why="a merge group that changes Electron: every platform"
          elif [ "$EVENT" = merge_group ] && [ "$PLATFORM" = true ]; then tier=merge; why="a merge group of platform-sensitive code"
          elif [ "$EVENT" = merge_group ]; then tier=fast; why="a merge group of code that isn't platform-sensitive (every platform runs nightly)"
          elif [ "$EVENT" = push ]; then tier=merge; why="a push to main no merge group tested"
          elif [ "$EVENT" != pull_request ]; then tier=full; why="a $EVENT run"
          # A draft, or a pull request stacked on another's branch: the checks only, no E2E, until it's ready and
          # targets main (its E2E would run again then anyway).
          elif [ "$DRAFT" = true ]; then tier=checks; why="a draft: the checks only, until it's marked ready for review"
          elif [ "$BASE_REF" != main ]; then tier=checks; why="stacked on $BASE_REF: the checks only, until it targets main"
          elif [ "$QUEUE" = true ] && [ "$ACTION" = labeled ] && [ "$LABEL" = ready ]; then tier=full; why="just labeled ready: the full tier now"
          elif [ "$QUEUE" = true ]; then tier=fast; why="a pull request: the merge queue runs the full tier"
          elif [ "$AUTHOR" = 'renovate[bot]' ] && [ "$PLATFORM" = true ]; then tier=full; why="Renovate's platform-sensitive update"
          elif [ "$READY" = true ]; then tier=full; why="labeled ready"
          else tier=fast; why="not labeled ready"
          fi
          echo "Tier: $tier ($why)."
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "why=$why" >> "$GITHUB_OUTPUT"
          # ── The platforms each tier runs, besides the fast tier's Linux x64 X11 shards ──────────────────────
          # Per merge: Windows x64 and macOS arm64, and perf.spec.ts on Linux x64 X11 and Windows x64, which have
          # baselines (perf-baseline.json has no macOS entry, so its perf job holds nothing to a budget). Nightly adds
          # the rest. macOS: GitHub's free plan runs 5 macOS jobs at a time, so a merge group takes 2 (its shards),
          # and the queue builds 2 groups at once: 4.
          merge_shards='{"name":"Windows x64","os":"windows-latest","shard":1,"shards":3}
          {"name":"Windows x64","os":"windows-latest","shard":2,"shards":3}
          {"name":"Windows x64","os":"windows-latest","shard":3,"shards":3}
          {"name":"macOS arm64","os":"macos-26","shard":1,"shards":2}
          {"name":"macOS arm64","os":"macos-26","shard":2,"shards":2}'
          nightly_shards='{"name":"Windows arm64","os":"windows-11-arm","shard":1,"shards":3}
          {"name":"Windows arm64","os":"windows-11-arm","shard":2,"shards":3}
          {"name":"Windows arm64","os":"windows-11-arm","shard":3,"shards":3}
          {"name":"macOS x64","os":"macos-15-intel","shard":1,"shards":2}
          {"name":"macOS x64","os":"macos-15-intel","shard":2,"shards":2}
          {"name":"Linux x64 · Wayland","os":"ubuntu-24.04","display":"wayland","shard":1,"shards":3}
          {"name":"Linux x64 · Wayland","os":"ubuntu-24.04","display":"wayland","shard":2,"shards":3}
          {"name":"Linux x64 · Wayland","os":"ubuntu-24.04","display":"wayland","shard":3,"shards":3}
          {"name":"Linux arm64 · X11","os":"ubuntu-24.04-arm","display":"x11","shard":1,"shards":3}
          {"name":"Linux arm64 · X11","os":"ubuntu-24.04-arm","display":"x11","shard":2,"shards":3}
          {"name":"Linux arm64 · X11","os":"ubuntu-24.04-arm","display":"x11","shard":3,"shards":3}'
          merge_perf='{"name":"Linux x64 · X11","os":"ubuntu-24.04","display":"x11","shard":"perf","shards":1}
          {"name":"Windows x64","os":"windows-latest","shard":"perf","shards":1}'
          nightly_perf='{"name":"macOS arm64","os":"macos-26","shard":"perf","shards":1}
          {"name":"Linux x64 · Wayland","os":"ubuntu-24.04","display":"wayland","shard":"perf","shards":1}
          {"name":"Linux arm64 · X11","os":"ubuntu-24.04-arm","display":"x11","shard":"perf","shards":1}
          {"name":"Windows arm64","os":"windows-11-arm","shard":"perf","shards":1}
          {"name":"macOS x64","os":"macos-15-intel","shard":"perf","shards":1}'
          # ─────────────────────────────────────────────────────────────────────────────────────────────────────
          # A repro: its one platform, one job, every spec file it names (CHORD_E2E_SPEC; playwright.config.ts).
          # Linux x64 X11's shards are the fast tier's own job, so its line is here.
          x11='{"name":"Linux x64 · X11","os":"ubuntu-24.04","display":"x11","shard":1,"shards":1}'
          repro_shards="$(printf '%s\n%s\n%s\n' "$x11" "$merge_shards" "$nightly_shards" | jq -c --arg p "$REPRO" '
            select((.name | ascii_downcase | gsub(" · "; "-") | gsub(" "; "-")) == $p) | .shard = 1 | .shards = 1' | head -n 1)"
          case "$tier" in
            repro)
              if [ -z "$repro_shards" ]; then echo "::error::No platform called $REPRO"; exit 1; fi
              shards="$repro_shards" perf="$merge_perf" ;;
            merge) shards="$merge_shards" perf="$merge_perf" ;;
            full) shards="$merge_shards"$'\n'"$nightly_shards" perf="$merge_perf"$'\n'"$nightly_perf" ;;
            # None runs; a matrix can't be empty, and the jobs are skipped.
            *) shards="$merge_shards" perf="$merge_perf" ;;
          esac
          echo "shards=$(printf '%s\n' "$shards" | jq -sc .)" >> "$GITHUB_OUTPUT"
          echo "perf=$(printf '%s\n' "$perf" | jq -sc .)" >> "$GITHUB_OUTPUT"
          # Chord Player: the full tier, or the merge tier when the player changed.
          if [ "$tier" = full ] || { [ "$tier" = merge ] && [ "$PLAYER" = true ]; }; then player=true; else player=false; fi
          echo "player=$player" >> "$GITHUB_OUTPUT"
      # Whether the password detector's corpus jobs (`forms`, `forms-ttw`) run: on a pull request, only when it
      # touches the detector, its corpora or what they're built from. Always on the full tier and every other run.
      - name: Password detector?
        id: forms
        env:
          EVENT: ${{ github.event_name }}
          TIER: ${{ steps.tier.outputs.tier }}
        run: |
          if [ "$TIER" = none ] || [ "$TIER" = checks ] || [ "$TIER" = repro ]; then
            echo "forms=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$TIER" = full ] || { [ "$EVENT" != pull_request ] && [ "$EVENT" != merge_group ]; }; then
            echo "The $TIER tier: the password detector's corpora run."
            echo "forms=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          forms=false
          while IFS= read -r file; do
            case "$file" in
              # The detector (the agent and core's classifier, recipes and vocabulary), its suites, and what
              # builds and runs them: Playwright, rolldown and the rest come in through the lockfile.
              apps/desktop/src/passwords/* | apps/desktop/test/forms/* | apps/desktop/playwright.forms.config.ts |               packages/core/src/password-* | packages/core/src/passwords.ts | packages/core/src/assistant-forms.ts |               packages/core/src/model.ts | apps/desktop/package.json | pnpm-lock.yaml | .github/workflows/ci.yml)
                forms=true; echo "The password detector's: $file"; break ;;
            esac
          done < "$RUNNER_TEMP/changed"
          echo "Password detector's corpora: $forms"
          echo "forms=$forms" >> "$GITHUB_OUTPUT"
      - name: Summary
        env:
          EVENT: ${{ github.event_name }}
          TIER: ${{ steps.tier.outputs.tier }}
          WHY: ${{ steps.tier.outputs.why }}
          CODE: ${{ steps.diff.outputs.code }}
          PLATFORM: ${{ steps.platform.outputs.platform }}
          FORMS: ${{ steps.forms.outputs.forms }}
          QUEUE: ${{ steps.queue.outputs.queue }}
        run: |
          {
            echo "## CI's $TIER tier"
            echo
            echo "Why: $WHY."
            echo
            echo "- **Fast tier:** typecheck, lint, unit tests, E2E on Linux x64 X11 (every spec but perf.spec.ts, in balanced shards), and the password detector's corpora when the detector changed."
            echo "- **Merge tier** (a merge group of platform-sensitive code): the fast tier plus E2E on Windows x64 and macOS arm64, perf.spec.ts on those and Linux x64 X11, and Chord Player when it changed."
            echo "- **Full tier** (nightly, by hand, \`ready\`, a merge group that changes Electron): all of that, plus E2E on Windows arm64, macOS x64, Linux x64 Wayland and Linux arm64, perf.spec.ts on each, the password detector's corpora, and Chord Player."
            echo
            if [ "$CODE" = true ]; then echo "Password detector's corpora: $([ "$FORMS" = true ] && echo run || echo "skipped (nothing they test changed)")."; echo; fi
            echo "Main's merge queue: $([ "$QUEUE" = true ] && echo on || echo "off (a pull request's \`E2E\` needs the full tier when it's platform-sensitive)")."
            echo
            if [ "$TIER" = none ]; then
              echo "A merge group already ran the full tier on this commit and passed: only the checks run."
            elif [ "$TIER" = checks ]; then
              echo "**The checks only** ($WHY). \`E2E\` stays pending: E2E runs once the pull request is ready for review and targets main."
            elif [ "$TIER" = repro ]; then
              echo "**A repro by hand:** one platform's E2E alone, with the spec, title filter and repeats given. It posts no \`E2E\` status."
            elif [ "$EVENT" = merge_group ]; then
              echo "A merge group: the $TIER tier, on the commit main gets. If it fails, the queue drops the pull request."
            elif [ "$EVENT" != pull_request ]; then
              echo "A $EVENT run: every platform runs. If it fails on main, ci-main-failed.yml opens an issue (or comments on the open one)."
            elif [ "$QUEUE" = true ] && [ "$CODE" = true ]; then
              echo "A pull request: \`E2E\` passes with the fast tier, and its merge group runs the platforms it needs before it merges (\`gh pr merge <n> --merge --auto\`). Label it \`ready\` to run every platform now."
            elif [ "$CODE" != true ]; then
              echo "**No E2E needed:** only docs, unit tests, dev or container-runner scripts, skills or Renovate's config changed. The checks run, and \`E2E\` passes."
            else
              echo "### Platform-sensitive: $PLATFORM"
              echo
              if [ "$PLATFORM" = true ]; then
                echo "These changed files touch code that behaves differently by OS (the list is in ci.yml's \`changes\` job):"
                echo
                head -n 100 "$RUNNER_TEMP/platform" | sed 's/^/- /'
                n="$(wc -l < "$RUNNER_TEMP/platform")"
                if [ "$n" -gt 100 ]; then echo "- … and $((n - 100)) more"; fi
                echo
                if [ "$TIER" = full ]; then
                  echo "The full tier is running, so \`E2E\` passes when every platform does."
                else
                  echo "So \`E2E\` stays pending after the fast tier: label the pull request \`ready\` (and mark it ready for review) to run every platform."
                fi
              else
                echo "None of the changed files touch platform code."
                echo
                if [ "$TIER" = full ]; then
                  echo "The full tier is running anyway ($WHY), so \`E2E\` passes when every platform does."
                else
                  echo "So \`E2E\` passes with the fast tier. Every platform still runs on main after the merge and each night."
                fi
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Typecheck · lint · unit tests
    # Not for a repro by hand: that's one platform's E2E alone.
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # The unit perf suite (*.perf.test.ts, docs/testing/performance.md): timed tests, one file at a time, so a budget
      # measures Chord and not the rest of the suite sharing the CPUs. pnpm test leaves them out.
      - run: pnpm test:perf
      # 5,000 passwords into a vault of 500, alone so nothing else shares the CPUs: chord-data's longest task during
      # the import is held to 100 ms (S17, Phase 2: import and export; measured 9.4 ms here, 10.6 ms on an SSD and 40 ms
      # on a slower drive on Windows), so a tenfold regression fails.
      - name: Password import's performance budget
        run: pnpm exec vitest run --config vitest.perf.config.ts packages/data/test/password-transfer.perf.test.ts
        env:
          CHORD_PASSWORD_PERF: '1'

  # The password detector on DuckDuckGo's corpus of real sites' forms, in Playwright's own headless Chromium
  # (apps/desktop/test/forms; S17 §13 layer 2), held to its baseline. The corpus is a pinned, hash-checked
  # download, kept in this job's cache and never in the repository or a release (decided 2026-11-15).
  # Bitwarden's test-the-web is the next job's, not this one's.
  forms:
    name: Password detector · corpus
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.forms == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache the corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/test/forms/.cache/ddg-*
          key: forms-corpus-${{ hashFiles('apps/desktop/test/forms/corpus.ts') }}
      - name: Cache Playwright's Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - run: pnpm --filter @chord/desktop exec playwright install --only-shell chromium
      - run: pnpm --filter @chord/desktop test:forms --project corpus
      - name: Upload the corpus score
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forms-score
          path: apps/desktop/test-results/forms/score.json
          if-no-files-found: ignore

  # The password detector on Bitwarden's test-the-web (GPL-3.0: tested against, never vendored), held to its
  # own baseline (test/forms/ttw.spec.ts). Its site is a pinned, hash-checked download that's built here
  # (test/forms/ttw.ts): `npm ci` of its locked packages, then `docusaurus build`. That runs a third party's
  # code, so this job is kept apart from anything a release uses:
  # - the checkout keeps no credentials (no GITHUB_TOKEN in .git/config);
  # - no pnpm-store cache: setup-node's `cache: pnpm` is what release.yml restores, so this job installs
  #   with a cold store and saves none (`package-manager-cache: false` too, so none is turned on for it);
  # - Playwright's Chromium is restored, never saved;
  # - the one cache it saves, `.cache/ttw-*` (the built site), is read by this job alone.
  # If the site can't be fetched or built it skips with a warning on pull requests, and fails on a push to
  # main, the nightly run or a run by hand (CHORD_TTW_REQUIRED), where a skip would hide a lasting breakage.
  forms-ttw:
    name: Password detector · test-the-web
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.forms == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Cache test-the-web's build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/test/forms/.cache/ttw-*
          key: forms-ttw-${{ hashFiles('apps/desktop/test/forms/ttw.ts') }}
      - name: Restore Playwright's Chromium
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - run: pnpm --filter @chord/desktop exec playwright install --only-shell chromium
      - run: pnpm --filter @chord/desktop test:forms --project ttw
        env:
          CHORD_TTW_REQUIRED: ${{ github.event_name != 'pull_request' && '1' || '0' }}
      - name: Upload the test-the-web score
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forms-ttw-score
          path: apps/desktop/test-results/forms/ttw-score.json
          if-no-files-found: ignore

  # Chord Player (apps/player): packaged on castLabs ECS per OS and smoke-tested, with ECS's
  # development signature. Only a player release is VMP-signed (player-release.yml). Full tier only.
  player:
    name: Chord Player · full tier
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.player == 'true'
    uses: ./.github/workflows/player.yml

  # Windows setup over a connected agent (issue #142, test/packaged/update-over-relay.spec.ts): the last release
  # installed for real, an agent's relay running from it and restarting, then this build's setup run over it, as a
  # person runs it and as the in-app updater does. Unsigned: what it checks doesn't depend on a signature.
  installer:
    name: Windows setup · update with an agent connected
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tier == 'full'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chord/desktop package --win --x64
      # The newest published release (they're pre-releases, which `gh release download` alone skips).
      - name: The last release's setup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName -q '.[0].tagName')"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*-win-x64-setup.exe' --dir "$RUNNER_TEMP/previous"
          echo "CHORD_PREVIOUS_INSTALLER=$(cygpath -w "$(ls "$RUNNER_TEMP"/previous/*-setup.exe)")" >> "$GITHUB_ENV"
          echo "CHORD_INSTALLER=$(cygpath -w "$(ls "$PWD"/apps/desktop/release/*-setup.exe)")" >> "$GITHUB_ENV"
      - run: pnpm --filter @chord/desktop test:packaged update-over-relay

  # E2E on every OS, each split into shards that run side by side on their own runners. A shard is a set of spec
  # files balanced by how long each takes (CHORD_E2E_SHARD; scripts/ci/e2e-shards.mjs and its map,
  # e2e-shards.json), each file's tests together and in order. Each shard sets its runner up in full.
  # Linux x64 X11 has 4 shards (about 5.7 min of tests each, and 4 of the 20 free Linux runners per push, where 6 took
  # 6: fewer jobs wait less in the queue); macOS has 2, the rest 3: GitHub's free plan runs
  # 5 macOS jobs at a time (and 20 jobs in all), and Chord Player takes 2 of those 5.
  # perf.spec.ts runs in a job of its own on each platform, on the full tier (`e2e-perf`): about 9 minutes, and
  # its timings are only reported on CI's shared machines.
  # Three jobs with the same steps (the YAML anchors below): the fast tier's Linux x64 X11 shards, which always
  # run, every other platform's, and perf.spec.ts's, the full tier's. The `e2e` job below says whether they passed.
  e2e-fast:
    name: E2E · fast tier · ${{ matrix.name }} · ${{ matrix.shard }}/${{ matrix.shards }}
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tier != 'repro'
    runs-on: ${{ matrix.os }}
    # A Linux shard took up to 18 minutes. The limit only has to catch a hung job.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64 · X11, os: ubuntu-24.04, display: x11, shard: 1, shards: 4 }
          - { name: Linux x64 · X11, os: ubuntu-24.04, display: x11, shard: 2, shards: 4 }
          - { name: Linux x64 · X11, os: ubuntu-24.04, display: x11, shard: 3, shards: 4 }
          - { name: Linux x64 · X11, os: ubuntu-24.04, display: x11, shard: 4, shards: 4 }
    env: &e2e-env
      # Names this shard's artifacts: captures-, perf- and e2e-failures-<runner>[-display]-<shard>of<shards>.
      ARTIFACT_SUFFIX: ${{ matrix.os }}${{ matrix.display && format('-{0}', matrix.display) || '' }}-${{ matrix.shard }}of${{ matrix.shards }}
      # The spec files this job runs (playwright.config.ts): <shard>/<shards>, or `perf` for perf.spec.ts alone.
      CHORD_E2E_SHARD: ${{ matrix.shard == 'perf' && 'perf' || format('{0}/{1}', matrix.shard, matrix.shards) }}
      # A repro by hand (workflow_dispatch with a platform): which spec files, which tests, how many times.
      CHORD_E2E_SPEC: ${{ github.event_name == 'workflow_dispatch' && inputs.platform != 'all' && inputs.spec || '' }}
      CHORD_E2E_GREP: ${{ github.event_name == 'workflow_dispatch' && inputs.platform != 'all' && inputs.grep || '' }}
      CHORD_E2E_REPEAT: ${{ github.event_name == 'workflow_dispatch' && inputs.platform != 'all' && inputs.repeat || '' }}
    steps: &e2e-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # Electron's own download (its postinstall, install-electron), kept per version, OS and architecture.
      - name: Electron's version
        id: electron
        shell: bash
        run: echo "version=$(node -p "require('./apps/desktop/package.json').devDependencies.electron")" >> "$GITHUB_OUTPUT"
      - name: Cache Electron's download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ steps.electron.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      - run: pnpm install --frozen-lockfile
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
      - run: pnpm build
      # Outside agents' transport (S18) on every OS: the endpoint, the relay, the gate, and on Windows the pipe's DACL
      # (window-owner.exe, just built), on Linux another user refused; and who's calling (M2a: pipe-clients, ss, lsof),
      # looked up for real on each OS, and the lookup's budget per OS (agent-peer.perf.test.ts). pnpm test and pnpm test:perf
      # run them on Linux too. Once per OS: in its first shard.
      - name: Agents' transport
        if: matrix.shard == 1
        run: pnpm exec vitest run apps/desktop/test/unit/agents.test.ts apps/desktop/test/unit/agent-peer.test.ts apps/desktop/test/unit/control.test.ts
      - name: Who's calling, timed
        if: matrix.shard == 1
        run: pnpm test:perf apps/desktop/test/unit/agent-peer.perf.test.ts
      # chord-data's perf rows on Windows' disks too, where a sync to disk costs most: a new profile's database (and
      # its migrations committed one by one, as before 2026-11-20, for comparison) and a big import's Undo.
      - name: chord-data's perf rows
        if: runner.os == 'Windows' && matrix.shard == 1
        run: pnpm test:perf packages/data

      # E2E's spelling dictionary: a pinned, hash-checked download served to Chord from this machine
      # (apps/desktop/test/dictionaries.ts), so no test downloads one from Google.
      - name: Cache the spelling dictionary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/test/.cache/dictionaries
          key: dictionaries-${{ hashFiles('apps/desktop/test/dictionaries.ts') }}

      # Chord Player's E2E test (player.spec.ts, Linux and Windows x64) packages the player on castLabs ECS: its checked zip, kept.
      - name: Cache castLabs ECS
        if: (runner.os == 'Linux' || runner.os == 'Windows') && runner.arch == 'X64'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/chord-ecs
          key: ecs-${{ runner.os }}-x64-${{ hashFiles('apps/player/ecs.json') }}

      # The packages below, kept between runs: the mirror has been slow enough to time the step out (10 minutes
      # once on main), and `apt-get update` alone took over a minute. Kept per runner image (GitHub's
      # ImageVersion, a new one about weekly), so the cached packages are the ones that image was missing.
      - name: Runner image
        id: image
        if: runner.os == 'Linux'
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache display-server packages
        id: apt-cache
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ matrix.os }}-${{ matrix.display }}-${{ steps.image.outputs.version }}-v3

      - name: Linux display servers
        if: runner.os == 'Linux'
        # A fresh runner can still be running unattended-upgrades; wait for
        # the dpkg lock rather than hang, and never prompt.
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
          CACHE_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
        run: |
          # Runner images ship Xvfb. X11 jobs add a window manager: a desktop always has one, and
          # without it no window is ever granted fullscreen (or activated the way a real one is).
          # The Wayland job installs Weston, which is its own.
          if ! command -v Xvfb >/dev/null; then NEED="xvfb"; fi
          if [ "${{ matrix.display }}" = "x11" ] && ! command -v openbox >/dev/null; then NEED="$NEED openbox"; fi
          # xdotool: the system pointer for tests that drag across Chord's views (test/e2e/system-pointer.ts).
          if [ "${{ matrix.display }}" = "x11" ] && ! command -v xdotool >/dev/null; then NEED="$NEED xdotool"; fi
          if [ "${{ matrix.display }}" = "wayland" ]; then NEED="$NEED weston"; fi
          if [ -n "$NEED" ]; then
            ARCHIVES="$HOME/apt-archives"
            mkdir -p "$ARCHIVES/partial"
            installed=false
            # On a cache hit, install the cached packages offline: no `apt-get update`, no mirror. The cache holds
            # what apt fetched on this image: packages it was missing, and some it upgraded (newer libraries the
            # new ones need), so a cached package goes in unless the same or a newer version is installed. If dpkg
            # can't, what it left half done is removed and apt fetches everything from the mirror.
            if [ "$CACHE_HIT" = true ] && ls "$ARCHIVES"/*.deb >/dev/null 2>&1; then
              debs=()
              for deb in "$ARCHIVES"/*.deb; do
                pkg="$(dpkg-deb -f "$deb" Package)"
                arch="$(dpkg-deb -f "$deb" Architecture)"
                version="$(dpkg-deb -f "$deb" Version)"
                [ "$arch" = all ] && name="$pkg" || name="$pkg:$arch"
                have="$(dpkg-query -W -f='${Status}|${Version}' "$name" 2>/dev/null || true)"
                if [ "${have%%|*}" != 'install ok installed' ] || dpkg --compare-versions "$version" gt "${have#*|}"; then debs+=("$deb"); fi
              done
              echo "Installing ${#debs[@]} cached packages offline."
              if [ "${#debs[@]}" -eq 0 ] || sudo -E dpkg -i --force-confdef --force-confold "${debs[@]}"; then
                installed=true
                for cmd in $NEED; do command -v "$([ "$cmd" = xvfb ] && echo Xvfb || echo "$cmd")" >/dev/null || installed=false; done
              fi
              if [ "$installed" != true ]; then
                echo "::warning::The cached packages didn't install offline; fetching them instead."
                # Packages dpkg unpacked but couldn't configure would hold apt to their versions: remove them.
                broken="$(dpkg-query -W -f='${db:Status-Abbrev} ${binary:Package}\n' | awk '$1 != "ii" && $1 !~ /^(un|rc|pn)/ { print $2 }')"
                if [ -n "$broken" ]; then echo "Removing what dpkg left half done: $broken"; sudo dpkg --remove --force-depends $broken; fi
              fi
            fi
            if [ "$installed" != true ]; then
              sudo -E apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 update
              # Packages already in the cache aren't downloaded again.
              sudo -E apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 -o Dir::Cache::Archives="$ARCHIVES" install -y --no-install-recommends $NEED
            fi
            sudo chown -R "$(id -u):$(id -g)" "$ARCHIVES"
          fi
          # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's
          # sandbox needs. Allow them on the test runner so E2E keeps the
          # sandbox on (packages ship an AppArmor profile instead).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # No core dumps. The tests crash pages on purpose, and the runners hand every crash to
          # systemd-coredump through a pipe, which ignores the shell's ulimit and takes long enough
          # over a renderer's core to hang the test that crashed it. A plain file name instead of
          # the pipe makes the E2E steps' `ulimit -c 0` count: nothing is written at all.
          sudo sysctl -w kernel.core_pattern=core

      - name: E2E (X11, Xvfb with openbox)
        if: matrix.display == 'x11'
        run: |
          # No core dumps (see the display servers step).
          ulimit -c 0
          xvfb-run -a sh -c '
            ready="$(mktemp -u)"
            openbox --startup "touch $ready" &
            for i in $(seq 1 100); do [ -e "$ready" ] && break; sleep 0.1; done
            [ -e "$ready" ] || { echo "openbox did not start"; exit 1; }
            pnpm --filter @chord/desktop test:e2e
          '

      - name: E2E (Wayland, headless Weston)
        if: matrix.display == 'wayland'
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=wayland-chord --idle-time=0 &
          for i in $(seq 1 50); do [ -S "$XDG_RUNTIME_DIR/wayland-chord" ] && break; sleep 0.1; done
          unset DISPLAY
          export WAYLAND_DISPLAY=wayland-chord XDG_SESSION_TYPE=wayland
          # No core dumps (see the display servers step).
          ulimit -c 0
          pnpm --filter @chord/desktop test:e2e

      - name: E2E
        if: runner.os != 'Linux'
        run: pnpm --filter @chord/desktop test:e2e

      # A test that passed only on its retry (Playwright's "flaky": the job stays green) goes in the job's summary,
      # with a warning on the run, so a repeat flake shows before it fails twice in one run and blocks a merge.
      - name: Flaky tests
        if: always()
        run: node scripts/ci/flaky-summary.mjs apps/desktop/playwright-report/results.json "${{ env.ARTIFACT_SUFFIX }}"

      - name: Upload design QA captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captures-${{ env.ARTIFACT_SUFFIX }}
          path: apps/desktop/test-results/captures/
          if-no-files-found: ignore

      # Performance budgets (test/e2e/perf.spec.ts): times reported here for trends, enforced only on
      # reference hardware; memory and warm launches held to each runner's baseline, which
      # `pnpm --filter @chord/desktop perf:baseline --run <id>` takes from these reports (docs/testing/performance.md).
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-${{ env.ARTIFACT_SUFFIX }}
          path: apps/desktop/test-results/perf.json
          if-no-files-found: ignore

      - name: Upload failure details
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failures-${{ env.ARTIFACT_SUFFIX }}
          path: apps/desktop/test-results/

  # The merge and full tiers' other platforms: which, the `changes` job says (its `Which tier?` step).
  e2e-full:
    name: E2E · ${{ needs.changes.outputs.tier }} tier · ${{ matrix.name }} · ${{ matrix.shard }}/${{ matrix.shards }}
    needs: changes
    if: needs.changes.outputs.code == 'true' && contains(fromJSON('["full", "merge", "repro"]'), needs.changes.outputs.tier)
    runs-on: ${{ matrix.os }}
    # A whole suite took 30 to 46 minutes with perf.spec.ts, and Playwright's --shard (by test count, not time)
    # once gave a macOS Intel shard 28 minutes (2026-11-22). Shards are balanced by time now, and the weights are
    # Linux's, so other platforms are only roughly even. These limits only have to catch a hung job.
    timeout-minutes: ${{ startsWith(matrix.os, 'macos') && 60 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.shards) }}
    env: *e2e-env
    steps: *e2e-steps

  # perf.spec.ts (docs/testing/performance.md) alone on each of the tier's platforms (merge and full tiers): launch times, memory and warm
  # launches, held to each runner's baseline (perf-baseline.json) where it has one. Its own job, so it doesn't
  # weigh down a shard; its perf-* artifacts are what `perf:baseline --run <id>` reads.
  e2e-perf:
    name: E2E · perf · ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true' && (needs.changes.outputs.tier == 'full' || needs.changes.outputs.tier == 'merge')
    runs-on: ${{ matrix.os }}
    # About 9 minutes on Linux x64 (2026-11-24). The limit only has to catch a hung job.
    timeout-minutes: ${{ startsWith(matrix.os, 'macos') && 60 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.perf) }}
    env: *e2e-env
    steps: *e2e-steps

  # The tier's E2E verdict, and the `E2E` commit status: the one status that says a pull request can merge, and
  # main's ruleset's one required check (for pull requests and merge groups alike). So it covers the whole run:
  # it fails when the checks, the password detector's corpora or Chord Player failed too.
  # This job passes when every shard of its tier passed, or none had to run (docs, unit tests, dev scripts alone), and
  # fails when any shard failed or was cancelled, or what changed couldn't be told. Its name says which tier ran.
  # The `E2E` status, posted on the pull request's head commit (or the pushed one), is:
  # - success when the full tier passed, or no E2E was needed, or the fast tier passed on a pull request that
  #   isn't platform-sensitive (the `changes` job);
  # - pending when the fast tier passed on a platform-sensitive pull request: every platform still has to (label
  #   it `ready`);
  # - failure when any shard failed.
  # A commit status, not this job's own check, because a job can only pass or fail: pending is what keeps a
  # fast-tier green from reading as a full one. A fast tier never takes back a full tier's success on the same
  # commit. A cancelled run posts nothing: the run that replaced it will. A fork's pull request gets a read-only
  # token, so it can't post one: the maintainer runs the full tier from a branch of this repository instead.
  e2e:
    name: E2E · ${{ needs.changes.outputs.tier || 'unknown' }} tier
    needs: [changes, checks, forms, forms-ttw, player, e2e-fast, e2e-full, e2e-perf, installer]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
      # The shards' timings, for the summary.
      actions: read
    steps:
      - name: Every shard of the tier passed, or none had to run
        id: verdict
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          TIER: ${{ needs.changes.outputs.tier }}
          PLATFORM: ${{ needs.changes.outputs.platform }}
          QUEUE: ${{ needs.changes.outputs.queue }}
          EVENT: ${{ github.event_name }}
          FAST: ${{ needs.e2e-fast.result }}
          FULL_SHARDS: ${{ needs.e2e-full.result }}
          PERF: ${{ needs.e2e-perf.result }}
          # The rest of the run: `E2E` is the one required check (main's ruleset), so it also fails when these do.
          CHECKS: ${{ needs.checks.result }}
          FORMS: ${{ needs.forms.result }}
          FORMS_TTW: ${{ needs.forms-ttw.result }}
          PLAYER: ${{ needs.player.result }}
          INSTALLER: ${{ needs.installer.result }}
        run: |
          # The full tier is its shards, perf.spec.ts's jobs and Windows setup's check (the `installer` job): failed
          # or cancelled if any was, else their result.
          # Windows setup's check runs on the full tier only: on the merge tier (or a repro) it's skipped, and counts for nothing.
          if [ "$TIER" != full ] && [ "$INSTALLER" = skipped ]; then INSTALLER="$PERF"; fi
          if [ "$FULL_SHARDS" = failure ] || [ "$PERF" = failure ] || [ "$INSTALLER" = failure ]; then FULL=failure
          elif [ "$FULL_SHARDS" = cancelled ] || [ "$PERF" = cancelled ] || [ "$INSTALLER" = cancelled ]; then FULL=cancelled
          elif [ "$FULL_SHARDS" = "$PERF" ] && [ "$PERF" = "$INSTALLER" ]; then FULL="$PERF"
          else FULL="$FULL_SHARDS, perf $PERF, Windows setup $INSTALLER"
          fi
          echo "What changed: $CHANGES (anything but docs: ${CODE:-unknown}; platform-sensitive: ${PLATFORM:-n/a}). Tier: ${TIER:-unknown}. Fast tier's shards: $FAST. Full tier's: $FULL."
          path=''
          pass=false state=failure
          # A cancelled run (a newer push replaced it, or cancelled by hand) posts nothing and fails nothing: the run
          # that replaced it posts the verdict. Only a job that failed counts against it.
          if [ "$CHANGES" = cancelled ]; then
            pass=true state='' desc="Cancelled before it could tell what changed"
          elif [ "$CHANGES" != success ]; then
            desc="Couldn't tell what changed ($CHANGES)"
          elif failed="$(for job in "checks:$CHECKS" "forms:$FORMS" "forms-ttw:$FORMS_TTW" "player:$PLAYER"; do
                  case "${job#*:}" in failure | cancelled) printf '%s ' "${job%%:*} (${job#*:})" ;; esac
                done)" && [ -n "$failed" ]; then
            failed="${failed% }"
            case "$failed" in
              *'(failure)'*) desc="Failed: $failed" ;;
              *) pass=true state='' desc="Cancelled: $failed" ;;
            esac
          elif [ "$TIER" = none ]; then
            # main's push of a commit a merge group already passed: its `E2E` stands, nothing to post.
            pass=true state='' desc="Tested in the merge queue: nothing more to run"
          elif [ "$TIER" = checks ]; then
            path="the checks only: a draft, or stacked on another pull request"
            pass=true state=pending desc="Checks passed; E2E runs once it's ready for review and targets main"
          elif [ "$TIER" = repro ]; then
            # A repro posts no status: one spec on one platform says nothing about the commit as a whole.
            path="a repro by hand: one platform's E2E"
            # Its one job is a shard; it runs no perf job.
            if [ "$FULL_SHARDS" = success ]; then pass=true state='' desc="Repro passed"; else state='' desc="Repro failed ($FULL_SHARDS)"; fi
          elif [ "$CODE" != true ]; then
            if [ "$FAST" = skipped ] && [ "$FULL" = skipped ]; then
              pass=true state=success desc="No E2E needed: docs, unit tests or dev scripts alone changed"
            else
              desc="No E2E needed, but the shards were $FAST and $FULL"
            fi
          elif [ "$FAST" = cancelled ] || [ "$FULL" = cancelled ]; then
            pass=true state='' desc="Cancelled (fast tier: $FAST, full tier: $FULL)"
          elif [ "$FAST" != success ]; then
            desc="Fast tier failed: Linux x64 X11 ($FAST)"
          elif [ "$TIER" = full ]; then
            path='every platform (the full tier)'
            if [ "$FULL" = success ]; then
              pass=true state=success desc="Full tier passed: every platform"
            else
              desc="Full tier failed ($FULL)"
            fi
          elif [ "$TIER" = merge ]; then
            path='the merge tier: Linux x64 X11, Windows x64 and macOS arm64 (the rest nightly)'
            if [ "$FULL" = success ]; then
              pass=true state=success desc="Merge tier passed: Linux x64, Windows x64, macOS arm64 (the rest nightly)"
            else
              desc="Merge tier failed ($FULL)"
            fi
          elif [ "$TIER" = fast ] && [ "$FULL" = skipped ] && [ "$EVENT" = merge_group ]; then
            path="the fast tier: the merge group isn't platform-sensitive"
            pass=true state=success desc="Fast tier passed; not platform-sensitive (every platform runs nightly)"
          elif [ "$TIER" = fast ] && [ "$FULL" = skipped ] && [ "$QUEUE" = true ]; then
            path="the fast tier, and the merge queue runs every platform"
            pass=true state=success desc="Fast tier passed; the merge queue runs the platforms it needs"
          elif [ "$TIER" = fast ] && [ "$FULL" = skipped ] && [ "$PLATFORM" = false ]; then
            path="the fast tier is enough: the pull request isn't platform-sensitive"
            pass=true state=success desc="Fast tier passed; this change isn't platform-specific (full tier runs nightly on main)"
          elif [ "$TIER" = fast ] && [ "$FULL" = skipped ] && [ "$PLATFORM" = true ]; then
            path="every platform has to pass: the pull request is platform-sensitive"
            pass=true state=pending desc='Touches platform code: label `ready` to run every platform'
          else
            desc="Unexpected: tier ${TIER:-unknown}, platform-sensitive ${PLATFORM:-unknown}, full tier's shards $FULL"
          fi
          echo "$desc"
          {
            echo "## E2E: ${TIER:-unknown} tier"
            echo
            if [ -n "$path" ]; then echo "Path: $path. The \`What changed\` job's summary lists the files that decided it."; echo; fi
            echo "| Shards | Result |"
            echo "| --- | --- |"
            echo "| Fast tier: Linux x64 X11 | $FAST |"
            echo "| Merge or full tier: the other platforms | $FULL_SHARDS |"
            echo "| Merge or full tier: perf.spec.ts, each platform | $PERF |"
            echo
            echo "**$desc.** The \`E2E\` status: ${state:-unchanged}."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "pass=$pass" >> "$GITHUB_OUTPUT"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "description=$desc" >> "$GITHUB_OUTPUT"

      # How even the shards were: each platform's longest and shortest E2E step, and a warning past 1.5× (refresh
      # the weights: node scripts/ci/e2e-shard-weights.mjs <run-id>). Never fails the job.
      - name: Shard balance
        if: needs.changes.outputs.code == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq '.jobs[]
            | select(.name | test("^E2E · (fast|merge|full) tier · .+ · [0-9]+/[0-9]+$"))
            | select(.conclusion == "success" or .conclusion == "failure")
            | {platform: (.name | sub("^E2E · (fast|merge|full) tier · "; "") | sub(" · [0-9]+/[0-9]+$"; "")),
               shard: (.name | capture("(?<s>[0-9]+/[0-9]+)$").s),
               seconds: ([.steps[] | select(.name | startswith("E2E")) | select(.conclusion == "success" or .conclusion == "failure")
                          | ((.completed_at | fromdate) - (.started_at | fromdate))] | add // 0)}
            | [.platform, .shard, .seconds] | @tsv' > "$RUNNER_TEMP/shards.tsv"
          if [ ! -s "$RUNNER_TEMP/shards.tsv" ]; then echo "No shard timings."; exit 0; fi
          {
            echo "### Shard balance (the E2E step, minutes)"
            echo
            echo "| Platform | Shards | Longest | Shortest | Ratio |"
            echo "| --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          # Per platform: shards, longest, shortest, ratio. Tab-separated in, one table row (and maybe a warning) out.
          awk -F '\t' -v warnings="$RUNNER_TEMP/warnings" '
            { n[$1]++
              if (!($1 in max) || $3 > max[$1]) { max[$1] = $3; maxs[$1] = $2 }
              if (!($1 in min) || $3 < min[$1]) { min[$1] = $3; mins[$1] = $2 } }
            END {
              for (p in n) {
                ratio = min[p] > 0 ? max[p] / min[p] : 0
                flag = ratio > 1.5 ? " ⚠" : ""
                printf "| %s | %d | %.1f (%s) | %.1f (%s) | %.2f×%s |\n", p, n[p], max[p] / 60, maxs[p], min[p] / 60, mins[p], ratio, flag
                if (ratio > 1.5) printf "::warning::E2E shards on %s are uneven: %.1f min against %.1f (%.2f×). Refresh the weights: node scripts/ci/e2e-shard-weights.mjs <run-id>\n", p, max[p] / 60, min[p] / 60, ratio > warnings
              }
            }' "$RUNNER_TEMP/shards.tsv" | sort >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/warnings" 2>/dev/null || true

      - name: Post the E2E status
        if: steps.verdict.outputs.state != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          STATE: ${{ steps.verdict.outputs.state }}
          DESCRIPTION: ${{ steps.verdict.outputs.description }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$FORK" = true ]; then
            echo "::warning::A fork's pull request can't post the E2E status ($STATE: $DESCRIPTION)"
            exit 0
          fi
          if [ "$STATE" = pending ]; then
            # Statuses come newest first.
            now="$(gh api "repos/$REPO/commits/$SHA/statuses" --jq '[.[] | select(.context == "E2E")][0].state // ""')"
            if [ "$now" = success ]; then
              echo "E2E already passed on $SHA: a fast tier leaves it."
              exit 0
            fi
          fi
          gh api "repos/$REPO/statuses/$SHA" -f state="$STATE" -f context=E2E -f description="$DESCRIPTION" -f target_url="$RUN_URL" --silent
          echo "E2E on $SHA: $STATE ($DESCRIPTION)."

      - name: The tier's verdict
        if: steps.verdict.outputs.pass != 'true'
        env:
          DESCRIPTION: ${{ steps.verdict.outputs.description }}
        run: |
          echo "::error::$DESCRIPTION"
          exit 1
