name: Chord Player

# Chord Player (ARCHITECTURE.md §9, §15.1): packaged on castLabs ECS for each OS on its own runner
# (apps/player/scripts/package.mjs), castLabs-VMP-signed through EVS for a release, smoke-tested
# (it plays a Widevine test stream, apps/player/scripts/smoke.mjs), and uploaded as artifacts. It
# never publishes anything: player-release.yml drafts releases from `player-v*` tags.
#
# The EVS_ACCOUNT_NAME and EVS_PASSWD secrets live in the protected `release` environment, so only
# a release build (player-release.yml, for a tag) can read them, after its reviewers approve. Every
# other build, from ci.yml on every run or by hand, keeps ECS's development signature.
#
# A release's Windows build is also code-signed (Authenticode) with Chord's own Azure Artifact Signing
# settings from that environment (the AZURE_* secrets and variables, and WIN_PUBLISHER_NAME, as
# release.yml signs Chord.exe), before it's VMP-signed. Other builds aren't code-signed.
#
# Linux arm64 isn't built: no Widevine CDM there that spike S14 could test. Linux has no VMP.
on:
  workflow_call:
    inputs:
      release:
        description: A release build, VMP-signed in the protected `release` environment
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Player · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A release build reads the EVS secrets, so it runs in the protected `release` environment and
    # waits for its reviewers. Other builds get no environment and no secrets.
    environment: ${{ inputs.release && 'release' || '' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest, target: win32-x64 }
          - { name: macOS arm64, os: macos-26, target: darwin-arm64 }
          - { name: macOS x64, os: macos-15-intel, target: darwin-x64 }
          - { name: Linux x64, os: ubuntu-24.04, target: linux-x64 }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ECS's zip, as checked against apps/player/ecs.json (scripts/fetch-ecs.mjs checks it again from the cache).
      - name: Cache castLabs ECS
        uses: actions/cache@v6
        with:
          path: ~/.cache/chord-ecs
          key: ecs-${{ matrix.target }}-${{ hashFiles('apps/player/ecs.json') }}

      # Only whether the EVS secrets are set reaches this step, never their values.
      - name: Choose how to VMP-sign
        id: vmp
        shell: bash
        env:
          WANT: ${{ inputs.release == true && matrix.target != 'linux-x64' }}
          RELEASE: ${{ inputs.release == true }}
          HAS_EVS: ${{ secrets.EVS_ACCOUNT_NAME != '' && secrets.EVS_PASSWD != '' }}
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$TARGET" = "linux-x64" ]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "Linux has no VMP: castLabs' Widevine CDM there doesn't check it."
          elif [ "$WANT" = "true" ] && [ "$HAS_EVS" = "true" ]; then
            echo "mode=production" >> "$GITHUB_OUTPUT"
            echo "CHORD_PLAYER_VMP=production" >> "$GITHUB_ENV"
          elif [ "$RELEASE" = "true" ]; then
            echo "::error::A Chord Player release must be VMP-signed: the EVS_ACCOUNT_NAME and EVS_PASSWD secrets aren't in the release environment (docs/releasing/signing.md, Chord Player)."
            exit 1
          else
            echo "mode=development" >> "$GITHUB_OUTPUT"
            echo "::notice::Not VMP-signed through EVS: this build keeps ECS's development signature, which only Widevine's test servers accept."
          fi

      # A Windows release must be code-signed: the settings are checked here, before EVS is asked for anything.
      # Only whether each is set reaches this step, never its value.
      - name: Check the code-signing settings (Windows release)
        if: inputs.release == true && matrix.target == 'win32-x64'
        shell: bash
        env:
          HAS_AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID != '' }}
          HAS_AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID != '' }}
          HAS_AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          HAS_AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT != '' }}
          HAS_AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
          HAS_AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE != '' }}
          HAS_WIN_PUBLISHER_NAME: ${{ vars.WIN_PUBLISHER_NAME != '' }}
        run: |
          missing=""
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE WIN_PUBLISHER_NAME; do
            has="HAS_$name"
            [ "${!has}" = "true" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::A Chord Player release must be code-signed on Windows, as Chord is: missing from the release environment:$missing (docs/releasing/signing.md, Chord Player)."
            exit 1
          fi

      - name: Python for castLabs EVS
        if: steps.vmp.outputs.mode == 'production'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # castlabs-evs pinned by its wheel's hash, in a venv of its own, run isolated (-I). Its token
      # and signature caches live in the runner's temp folder, never in the workspace or an artifact.
      - name: Install castLabs EVS
        if: steps.vmp.outputs.mode == 'production'
        shell: bash
        run: |
          python -I -m venv "$RUNNER_TEMP/evs-venv"
          py="$RUNNER_TEMP/evs-venv/bin/python"
          [ -x "$py" ] || py="$RUNNER_TEMP/evs-venv/Scripts/python.exe"
          "$py" -I -m pip install --disable-pip-version-check --no-input --no-deps --require-hashes -r apps/player/build/evs-requirements.txt
          "$py" -I -m pip install --disable-pip-version-check --no-input -r apps/player/build/evs-dependencies.txt
          mkdir -p "$RUNNER_TEMP/evs"
          chmod 700 "$RUNNER_TEMP/evs"
          {
            echo "CHORD_EVS_PYTHON=$py"
            echo "EVS_CONFIG_FILE=$RUNNER_TEMP/evs/config.json"
            echo "EVS_CACHE_FILE=$RUNNER_TEMP/evs/cache.json"
            echo "EVS_NO_ASK=1"
          } >> "$GITHUB_ENV"

      # The only step that sees the account's name and password. Once, without retrying: an expired or
      # wrong login fails here, and castLabs asks accounts not to repeat requests needlessly.
      - name: Sign in to castLabs EVS
        if: steps.vmp.outputs.mode == 'production'
        shell: bash
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: '"$CHORD_EVS_PYTHON" -I -m castlabs_evs.account --no-ask reauth'

      # VMP signing happens in here, in castLabs' order: macOS before code signing (afterPack), Windows after it.
      # On a pull request electron-builder skips Mac signing unless told otherwise, even the ad-hoc signature
      # (identity '-') that "Check the signature" verifies. A pull request's build has no signing keys to expose.
      - name: Package
        shell: bash
        env:
          CSC_FOR_PULL_REQUEST: 'true'
          # Windows release builds only: Authenticode signing by electron-builder (apps/player/electron-builder.config.ts),
          # before package.mjs VMP-signs. Empty everywhere else, and then nothing is code-signed.
          AZURE_TENANT_ID: ${{ inputs.release == true && matrix.target == 'win32-x64' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ inputs.release == true && matrix.target == 'win32-x64' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ inputs.release == true && matrix.target == 'win32-x64' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_SIGNING_ENDPOINT: ${{ inputs.release == true && matrix.target == 'win32-x64' && vars.AZURE_SIGNING_ENDPOINT || '' }}
          AZURE_SIGNING_ACCOUNT: ${{ inputs.release == true && matrix.target == 'win32-x64' && vars.AZURE_SIGNING_ACCOUNT || '' }}
          AZURE_SIGNING_PROFILE: ${{ inputs.release == true && matrix.target == 'win32-x64' && vars.AZURE_SIGNING_PROFILE || '' }}
          WIN_PUBLISHER_NAME: ${{ inputs.release == true && matrix.target == 'win32-x64' && vars.WIN_PUBLISHER_NAME || '' }}
        run: node apps/player/scripts/package.mjs --out "$GITHUB_WORKSPACE/apps/player/release"

      - name: Forget the EVS tokens
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/evs"

      - name: Check the signature (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          check="$RUNNER_TEMP/codesign-check"
          rm -rf "$check" && mkdir -p "$check"
          node -e "import('./packages/player-protocol/src/zip.ts').then(z => z.extractZip(process.argv[1], process.argv[2], { maxBytes: 2 ** 31 }))" apps/player/release/chord-player-*-${{ matrix.target }}.zip "$check/app"
          codesign --verify --deep --strict --verbose=2 "$check/app/Chord Player.app"
          codesign --display --verbose=2 "$check/app/Chord Player.app" 2>&1 | grep -E '^(Identifier|Format|Signature|TeamIdentifier)='
          rm -rf "$check"

      # A Windows release's Chord Player.exe, as Chord unpacks it from the zip, must carry a valid, timestamped
      # Authenticode signature from Chord's publisher (as release.yml checks Chord.exe). VMP signing came after
      # it and package.mjs's verify-pkg passed, so this also shows VMP signing left the code signature intact.
      - name: Check the code signature (Windows release)
        if: inputs.release == true && runner.os == 'Windows'
        shell: pwsh
        env:
          WIN_PUBLISHER_NAME: ${{ vars.WIN_PUBLISHER_NAME }}
          TARGET: ${{ matrix.target }}
        run: |
          $check = Join-Path $env:RUNNER_TEMP 'authenticode-check'
          if (Test-Path $check) { Remove-Item -Recurse -Force $check }
          $zip = (Get-ChildItem apps/player/release -Filter "chord-player-*-$env:TARGET.zip" | Select-Object -First 1).FullName
          if (-not $zip) { throw 'No Chord Player zip to check' }
          node -e "import('./packages/player-protocol/src/zip.ts').then(z => z.extractZip(process.argv[1], process.argv[2], { maxBytes: 2 ** 31 }))" $zip (Join-Path $check 'app')
          if ($LASTEXITCODE -ne 0) { throw "Couldn't unpack $zip" }
          $exe = Join-Path $check 'app\Chord Player.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $exe
          $signer = $signature.SignerCertificate
          $name = if ($signer) { $signer.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) } else { '' }
          "Chord Player.exe: $($signature.Status), signed by '$name', timestamped by '$($signature.TimeStamperCertificate.Subject)'"
          if ($signature.Status -ne 'Valid') { throw "Chord Player.exe isn't validly signed: $($signature.StatusMessage)" }
          if (-not $signature.TimeStamperCertificate) { throw "Chord Player.exe has no timestamp, so its signature would lapse with the certificate" }
          if ($name -ne $env:WIN_PUBLISHER_NAME -and $signer.Subject -ne $env:WIN_PUBLISHER_NAME) { throw "Chord Player.exe is signed by '$($signer.Subject)', not by '$env:WIN_PUBLISHER_NAME'" }
          Remove-Item -Recurse -Force $check

      - name: Linux display and sandbox
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if ! command -v Xvfb > /dev/null; then
            sudo -E apt-get -o DPkg::Lock::Timeout=300 update
            sudo -E apt-get -o DPkg::Lock::Timeout=300 install -y --no-install-recommends xvfb
          fi
          # The player is a per-user install with no AppArmor profile: allow the user namespaces its sandbox
          # uses, as a user would have to on Ubuntu 23.10 and later (Chord doesn't offer it there otherwise).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.core_pattern=core

      - name: Smoke test
        shell: bash
        run: |
          mkdir -p apps/player/release/smoke
          zip="$(ls apps/player/release/chord-player-*-${{ matrix.target }}.zip)"
          if [ "$RUNNER_OS" = "Linux" ]; then
            ulimit -c 0
            xvfb-run -a node apps/player/scripts/smoke.mjs --zip "$zip" --out apps/player/release/smoke
          else
            node apps/player/scripts/smoke.mjs --zip "$zip" --out apps/player/release/smoke
          fi

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: chord-player-${{ matrix.target }}
          if-no-files-found: error
          path: |
            apps/player/release/chord-player-*.zip
            apps/player/release/chord-player-*.json

      - name: Upload the smoke test's capture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: player-smoke-${{ matrix.target }}
          path: apps/player/release/smoke/
          if-no-files-found: ignore
