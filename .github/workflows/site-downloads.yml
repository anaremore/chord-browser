name: Site downloads

# chordbrowser.com's download links (/download/<file>) redirect to the newest
# release's files. When a release is published or deleted, this rewrites those
# redirects (site/tools/latest.mjs) and commits them to main, and Clank
# redeploys the site from main. Run it by hand to refresh the links any time.
# Publishing a release is a person's step, so nothing here runs for a draft.
on:
  release:
    types: [published, deleted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-downloads
  cancel-in-progress: false

jobs:
  links:
    name: Point the downloads at the newest release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node site/tools/latest.mjs

      - name: Commit the new links
        run: |
          if git diff --quiet -- site/downloads.conf site/public/latest.json; then
            echo "The links already point to the newest release."
            exit 0
          fi
          version="$(node -p "require('./site/public/latest.json').tag")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/downloads.conf site/public/latest.json
          git commit -m "chore(site): downloads point to $version"
          # Someone may have pushed since the checkout: replay this one small commit on top.
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

      # Clank redeploys the site when main changes (its GitHub App must have access to this repo:
      # site/README.md). A deploy that doesn't happen fails here, so it's noticed, instead of the
      # site quietly offering the last version.
      - name: Check chordbrowser.com serves it
        run: |
          want="$(node -p "require('./site/public/latest.json').version")"
          for attempt in $(seq 1 40); do
            got="$(curl -fsS "https://chordbrowser.com/latest.json?check=$GITHUB_RUN_ID-$attempt" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).version)}catch{console.log('')}})" || true)"
            if [ "$got" = "$want" ]; then
              echo "chordbrowser.com offers $want."
              exit 0
            fi
            sleep 15
          done
          echo "::error title=Site not updated::chordbrowser.com still offers ${got:-nothing it could read} after 10 minutes, not $want. Check that Clank's GitHub App can see this repo and that the site's last deploy succeeded (site/README.md, On Clank)."
          exit 1
